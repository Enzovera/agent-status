name: release

# Push a tag like v0.1.0 to build the server for every platform and publish a release.
on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: Test
        run: go test ./...
      - name: Build
        run: |
          mkdir dist
          for t in windows/amd64 windows/arm64 linux/amd64 linux/arm64 darwin/amd64 darwin/arm64; do
            os=${t%/*}; arch=${t#*/}; ext=""
            [ "$os" = windows ] && ext=.exe
            CGO_ENABLED=0 GOOS=$os GOARCH=$arch go build -trimpath -ldflags="-s -w" \
              -o "dist/agent-status-$os-$arch$ext" ./cmd/agent-status
          done
          zip -r dist/agent-status-clients.zip clients install
          (cd dist && sha256sum * > SHA256SUMS.txt)
      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" dist/* --title "$GITHUB_REF_NAME" --notes-file - <<'EOF'
          Serwer: pobierz plik dla swojego systemu (`windows-amd64.exe`, `linux-amd64`, `darwin-arm64` itd.) i uruchom `-addr :7777`.

          Klienci (urządzenia z Claude Code / OpenCode), Windows:
          ```powershell
          & ([scriptblock]::Create((irm https://raw.githubusercontent.com/Enzovera/agent-status/main/install/client.ps1))) -Server IP_SERWERA
          ```
          macOS / Linux:
          ```sh
          curl -fsSL https://raw.githubusercontent.com/Enzovera/agent-status/main/install/client.sh | sh -s -- --server IP_SERWERA
          ```

          Szczegóły w README.
          EOF
