<!doctype html>
<html lang="pl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Agenci</title>
<script>
  // Set before the first paint, so the page never flashes in the other theme.
  try { document.documentElement.dataset.theme = localStorage.getItem("theme") === "light" ? "light" : "dark"; }
  catch { document.documentElement.dataset.theme = "dark"; }
  // Polish unless switched to English (the language button); shared with the stats page.
  try { document.documentElement.lang = localStorage.getItem("lang") === "en" ? "en" : "pl"; } catch {}
</script>
<style>
  /* Swimlanes: each session is a row with its recent states drawn on a strip; "now" is the right edge.
     Grouped by machine, by project, or as a queue ordered by what the session needs from you. */
  :root {
    --bg: #f2f3f1; --panel: #fbfbfa; --line: #d6d8d3; --grid: #e6e8e3; --text: #1a1c19; --muted: #686d66;
    --signal: #d0401f; --signal-soft: #fbe7e1; --ok: #3c8a5a; --warn: #b07405; --warn-soft: #f8efdc;
    --idle: #c4c8c1; --ended: #e0e2dd; --on-signal: #fff;
    --sans: "Archivo", "Segoe UI", system-ui, sans-serif;
    --mono: "Cascadia Mono", Consolas, ui-monospace, monospace;
    color-scheme: light;
  }
  /* Dark unless switched to light (the theme button); not taken from the system. */
  :root[data-theme="dark"] {
    --bg: #131513; --panel: #1a1c1a; --line: #2e322e; --grid: #242724; --text: #e8eae6; --muted: #959b93;
    --signal: #ff7552; --signal-soft: #33201b; --ok: #5dbb83; --warn: #e3a63c; --warn-soft: #2c2414;
    --idle: #454a44; --ended: #2a2d2a; --on-signal: #131513;
    color-scheme: dark;
  }
  * { box-sizing: border-box; border-radius: 0; }
  body {
    margin: 0; padding: 16px; background: var(--bg); color: var(--text);
    font: 14px/1.45 var(--sans); font-variant-numeric: tabular-nums;
  }
  header { display: flex; justify-content: space-between; align-items: center; gap: 10px 16px; flex-wrap: wrap; margin-bottom: 14px; }
  .title { display: flex; align-items: baseline; gap: 14px; min-width: 0; }
  h1 { font-size: 20px; margin: 0; font-weight: 700; }
  .bar { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; justify-content: flex-end; }
  .group { display: inline-flex; border: 1px solid var(--line); }
  .group > button, .group > .btn, .more > button {
    display: inline-flex; align-items: center; justify-content: center; gap: 6px;
    font: inherit; font-size: 13px; padding: 4px 10px; min-height: 34px; min-width: 38px; border: 0; cursor: pointer;
    background: var(--panel); color: var(--muted); text-decoration: none;
  }
  .group > * + * { border-left: 1px solid var(--line); }
  .group > button[aria-pressed="true"] { background: var(--text); color: var(--bg); }
  .group > button:focus-visible, .group > .btn:focus-visible, .more > button:focus-visible { outline: 2px solid var(--text); outline-offset: 1px; }
  .group > button.locked { color: var(--warn); }
  /* Language: the code of the language shown now, in place of an icon. */
  .group > button.lang { font: 600 13px/1 var(--mono); letter-spacing: .04em; }
  .ico { width: 18px; height: 18px; flex: none; fill: none; stroke: currentColor; stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round; }
  /* Words next to the layout icons only where there is room for them. */
  .lbl { display: none; }
  @media (min-width: 1000px) { .lbl { display: inline; } }

  /* "More": rarely used switches, with words, so the bar can stay icons only. */
  .more { position: relative; display: inline-flex; }
  .more > button[aria-expanded="true"] { background: var(--text); color: var(--bg); }
  .menu {
    position: absolute; right: -1px; top: calc(100% + 6px); z-index: 20; min-width: 240px;
    display: grid; background: var(--panel); border: 1px solid var(--line); box-shadow: 0 8px 24px rgb(0 0 0 / .25);
  }
  .menu[hidden] { display: none; }
  .menu button {
    display: flex; align-items: center; gap: 10px; width: 100%; padding: 10px 14px; min-height: 44px;
    font: inherit; font-size: 14px; text-align: left; border: 0; background: none; color: var(--text); cursor: pointer;
  }
  .menu button + button { border-top: 1px solid var(--grid); }
  .menu button[aria-pressed="true"]::after { content: "✓"; margin-left: auto; color: var(--ok); font-weight: 700; }
  .menu button:focus-visible { outline: 2px solid var(--text); outline-offset: -2px; }
  /* The time range moves into the menu on a phone (see the 560px query). */
  .menu-range { display: none; align-items: center; gap: 4px; padding: 8px 14px; border-bottom: 1px solid var(--line); font-size: 13px; color: var(--muted); }
  .menu-range span { margin-right: auto; white-space: nowrap; }
  .menu .menu-range button { width: auto; min-height: 40px; min-width: 44px; padding: 4px 8px; justify-content: center; border: 1px solid var(--line); }
  .menu .menu-range button + button { border-top: 1px solid var(--line); }
  .menu .menu-range button[aria-pressed="true"] { background: var(--text); color: var(--bg); }
  .menu .menu-range button[aria-pressed="true"]::after { content: none; }
  /* The language moves into the menu on a narrow phone (see the 420px query). */
  .menu-range.menu-lang { display: none; }
  .menu-legend { display: grid; grid-template-columns: 1fr 1fr; gap: 4px 12px; padding: 10px 14px; border-top: 1px solid var(--line); font-size: 12px; color: var(--muted); }
  .menu-legend i { display: inline-block; width: 14px; height: 8px; margin-right: 6px; }
  button, .head { touch-action: manipulation; -webkit-tap-highlight-color: transparent; }

  /* Seen from the corner of your eye: a frame around the whole screen and a big line on top
     while a session waits for you (or needs a look). */
  body::before { content: ""; position: fixed; inset: 0; z-index: 10; pointer-events: none; border: 0 solid transparent; }
  body.alarm-waiting::before { border: 8px solid var(--signal); }
  body.alarm-check::before { border: 8px solid var(--warn); }
  /* Waiting for more than 5 minutes: the frame breathes, so it gets noticed even after you got used to it. */
  body.alarm-waiting.alarm-long::before { border-width: 12px; animation: breathe 2s ease-in-out infinite; }
  @keyframes breathe { 50% { border-color: color-mix(in srgb, var(--signal) 35%, transparent); } }
  @media (prefers-reduced-motion: reduce) { body.alarm-waiting.alarm-long::before { animation: none; } }
  .beacon {
    display: block; width: 100%; margin: 0 0 16px; padding: 12px 16px; border: 0; cursor: pointer; text-align: left;
    font: 700 22px/1.25 var(--sans); background: var(--signal); color: var(--on-signal);
  }
  .beacon.check { background: var(--warn); }
  .beacon[hidden] { display: none; }
  .beacon small { display: block; font: 400 14px/1.35 var(--sans); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .beacon:focus-visible { outline: 2px solid var(--text); outline-offset: 2px; }
  .summary { color: var(--muted); font-size: 13px; }
  .summary b { color: var(--text); }
  .summary b.signal { color: var(--signal); }

  .hosts { display: grid; gap: 16px; }
  section { border: 1px solid var(--line); background: var(--panel); }
  .lanes, .head { display: grid; grid-template-columns: minmax(150px, 240px) minmax(0, 1fr) 104px; gap: 4px 16px; align-items: center; }
  section h2 {
    margin: 0; padding: 8px 14px; font-size: 13px; font-weight: 700;
    border-bottom: 1px solid var(--line); background: var(--bg);
  }
  section h2 .name { text-transform: uppercase; letter-spacing: .04em; }
  section h2 small { color: var(--muted); font-weight: 400; text-transform: none; letter-spacing: 0; margin-left: 8px; font-size: 12px; }
  section h2 .rename {
    font: 400 12px var(--sans); margin-left: 8px; padding: 0 4px; border: 0; background: none; cursor: pointer;
    color: var(--muted); text-transform: none; letter-spacing: 0;
  }
  section h2 .rename:focus-visible { outline: 2px solid var(--text); outline-offset: 1px; }
  section.q-waiting h2 .name { color: var(--signal); }
  section.q-check h2 .name { color: var(--warn); }
  .ticks { position: relative; height: 14px; font: 11px/14px var(--mono); color: var(--muted); font-weight: 400; }
  .ticks span { position: absolute; transform: translateX(-50%); white-space: nowrap; }
  .ticks span.first { transform: none; }
  .ticks span.last { transform: translateX(-100%); color: var(--text); }

  .older {
    display: block; width: 100%; padding: 10px 14px; min-height: 40px;
    font: inherit; font-size: 13px; text-align: left; border: 0; border-top: 1px solid var(--grid);
    background: var(--bg); color: var(--muted); cursor: pointer;
  }
  .older small { font-size: 12px; margin-left: 10px; }
  .older.kids { padding-left: 32px; background: none; border-top: 0; min-height: 32px; padding-top: 4px; padding-bottom: 6px; }
  .older:focus-visible { outline: 2px solid var(--text); outline-offset: -2px; }
  .row { border-bottom: 1px solid var(--grid); }
  /* A subagent's session under its parent: indented, with a hook that ties it up. */
  .row.child .who { padding-left: 18px; position: relative; }
  .row.child .who::before { content: "↳"; position: absolute; left: 0; top: 0; color: var(--muted); }
  .row.child .who b { font-weight: 500; }
  .row:last-child { border-bottom: 0; }
  .head { padding: 10px 14px; cursor: pointer; }
  .head:focus-visible { outline: 2px solid var(--text); outline-offset: -2px; }
  .row.waiting { background: var(--signal-soft); }
  .row.error, .row.stale { background: var(--warn-soft); }
  .row.ended { opacity: .6; }
  .row.open { opacity: 1; }
  .who { min-width: 0; }
  .who b { display: block; font-weight: 600; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .who b::before { content: "▸"; display: inline-block; width: 14px; color: var(--muted); font-weight: 400; }
  .row.open .who b::before { content: "▾"; }
  .who span { display: block; padding-left: 14px; font-size: 12px; color: var(--muted); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .trk { min-width: 0; display: grid; gap: 4px; }
  .strip {
    position: relative; height: 14px; overflow: hidden;
    background: repeating-linear-gradient(to left, var(--grid) 0 1px, transparent 1px calc(100% / var(--n, 6)));
  }
  .strip i { position: absolute; top: 0; bottom: 0; }
  .s-working { background: var(--ok); }
  .s-waiting { background: var(--signal); }
  .s-error { background: var(--warn); }
  .s-idle { background: var(--idle); }
  .s-ended { background: var(--ended); }
  .s-stale { background: repeating-linear-gradient(135deg, var(--warn) 0 3px, transparent 3px 7px); }
  .strip .now { right: 0; width: 2px; background: var(--text); }
  .cap { min-width: 0; font-size: 13px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .cap .detail { font: 12px var(--mono); color: var(--muted); margin-left: 10px; }
  .cap .detail:first-child { margin-left: 0; }
  .machines { display: flex; flex-wrap: wrap; gap: 6px 18px; margin: -4px 0 12px; font-size: 13px; }
  .machines span { white-space: nowrap; }
  .machines small, .host-state small { color: var(--muted); font-size: 12px; }
  .dot { display: inline-block; width: 8px; height: 8px; margin-right: 6px; border-radius: 50%; background: var(--ok); vertical-align: 1px; }
  .dot.off { background: transparent; border: 1.5px solid var(--warn); }
  .machines .off-name { color: var(--warn); }
  .host-state { font-weight: 400; text-transform: none; letter-spacing: 0; margin-left: 10px; font-size: 12px; }
  .cap .chip { display: inline-block; margin-right: 8px; padding: 0 5px; border: 1px solid var(--line); font-size: 12px; color: var(--muted); background: var(--panel); }
  .cap .chip.warm { color: var(--warn); border-color: color-mix(in srgb, var(--warn) 50%, transparent); }
  .cap .chip.hot { color: var(--signal); border-color: var(--signal); font-weight: 600; }
  .cap .chip.sub { color: var(--ok); border-color: color-mix(in srgb, var(--ok) 50%, transparent); }
  /* Running subagents, one line each: type · task · current tool call, and how long it runs. */
  .subs { list-style: none; margin: 2px 0 0; padding: 0 0 0 10px; border-left: 2px solid color-mix(in srgb, var(--ok) 45%, transparent); display: grid; gap: 1px; }
  .subs li { display: flex; align-items: baseline; gap: 8px; min-width: 0; font-size: 12px; line-height: 1.5; }
  .subs .what { flex: 1 1 auto; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .subs .type { color: var(--ok); margin-right: 6px; }
  .subs b { font-weight: 600; margin-right: 8px; }
  .subs .doing { font-family: var(--mono); color: var(--muted); }
  .subs small { flex: none; font: 11px var(--mono); color: var(--muted); }
  .subs li.quiet .type { color: var(--muted); }
  .subs li.quiet small::after { content: " · cisza"; color: var(--warn); }
  :root[lang="en"] .subs li.quiet small::after { content: " · quiet"; }
  /* Narrow: the current tool call gets a line of its own instead of being cut to "Bash:…". */
  @media (max-width: 700px) {
    .subs .doing { display: block; overflow: hidden; text-overflow: ellipsis; font-size: 11px; }
  }
  .state small[data-pre] { font-weight: 600; }
  .state.waiting small { color: var(--signal); }
  .row.waiting .cap { white-space: normal; overflow-wrap: anywhere; }
  .row.waiting .cap .detail { display: block; margin: 2px 0 0; font: 600 14px/1.35 var(--sans); color: var(--signal); }
  .row.open .cap { white-space: normal; overflow-wrap: anywhere; }
  .state { text-align: right; font-size: 13px; font-weight: 600; line-height: 1.25; white-space: nowrap; }
  .state small { display: block; font: 11px var(--mono); color: var(--muted); font-weight: 400; }
  .state.waiting { color: var(--signal); }
  .state.error, .state.stale { color: var(--warn); }
  .state.working { color: var(--ok); }
  .state.idle, .state.ended { color: var(--muted); font-weight: 400; }

  .info { margin: 0 14px; padding: 10px 0 14px 14px; border-top: 1px dashed var(--line); font-size: 13px; }
  .info dl { display: grid; grid-template-columns: max-content 1fr; gap: 3px 12px; margin: 0; }
  .info dt { color: var(--muted); }
  .info dd { margin: 0; overflow-wrap: anywhere; min-width: 0; }
  .info code { font: 12px/1.4 var(--mono); }
  .info h3 { font-size: 11px; font-weight: 700; text-transform: uppercase; letter-spacing: .04em; color: var(--muted); margin: 12px 0 4px; }
  .text { white-space: pre-wrap; overflow-wrap: anywhere; margin: 0; padding: 6px 8px; background: var(--bg); border-left: 2px solid var(--line); max-width: 90ch; }
  .tools { display: flex; flex-wrap: wrap; gap: 4px; }
  .tools span { border: 1px solid var(--line); padding: 1px 6px; background: var(--panel); }
  .tools b { font-weight: 600; margin-left: 4px; }
  .history { list-style: none; margin: 0; padding: 0; }
  .history li { display: grid; grid-template-columns: 64px 1fr; gap: 8px; padding: 2px 0; }
  .history time { color: var(--muted); font-family: var(--mono); font-size: 12px; }
  .history .msg { overflow-wrap: anywhere; min-width: 0; }
  .history .st { font-weight: 600; margin-right: 6px; }
  .history .st.waiting { color: var(--signal); }
  .history .st.error { color: var(--warn); }
  .history .st.working { color: var(--ok); }
  .history .st.idle, .history .st.ended { color: var(--muted); }
  .history .kind { color: var(--muted); }
  .actions { margin-top: 12px; display: flex; flex-wrap: wrap; gap: 8px; }
  .actions button {
    font: inherit; font-size: 13px; padding: 4px 10px; min-height: 32px; cursor: pointer;
    background: var(--panel); color: var(--text); border: 1px solid var(--line);
  }
  .actions button[data-remove] { color: var(--signal); }
  .empty, .offline { color: var(--muted); padding: 24px 0; }
  .offline { color: var(--warn); }

  /* Hover styles only where there is a real pointer: on a touch screen they stick after a tap. */
  @media (hover: hover) {
    .head:hover { background: color-mix(in srgb, var(--text) 4%, transparent); }
    section h2 .rename:hover { color: var(--text); text-decoration: underline; }
    .actions button:hover { border-color: var(--text); }
    .actions button[data-remove]:hover { border-color: var(--signal); }
  }
  /* Finger-sized targets on a touch screen. */
  @media (pointer: coarse) {
    .group > button, .group > .btn, .more > button { min-height: 44px; min-width: 44px; padding: 8px 10px; font-size: 15px; }
    .actions button { min-height: 44px; padding: 8px 14px; font-size: 15px; }
    section h2 .rename { padding: 10px 8px; margin: -10px 0 -10px 4px; font-size: 13px; }
    .head { padding: 14px; }
    .summary { font-size: 15px; }
  }

  /* Phone: the bar takes the whole width under the title, the three groups spread across it. */
  @media (max-width: 560px) {
    body { padding: 12px; }
    header { gap: 8px; }
    .title { width: 100%; justify-content: space-between; }
    .bar { width: 100%; justify-content: space-between; gap: 6px; }
    .group > button, .group > .btn, .more > button { padding: 4px 8px; min-width: 44px; }
    .bar .range { display: none; }
    .menu-range { display: flex; }
    .beacon { font-size: 18px; padding: 10px 12px; }
  }
  /* A narrow phone has no room for a fifth button in the bar: the language goes into the menu. */
  @media (max-width: 420px) {
    .bar #lang { display: none; }
    .menu-range.menu-lang { display: flex; }
  }
  @media (max-width: 700px) {
    .ticks span:not(.first):not(.last):not(.mid) { display: none; }
    .lanes { grid-template-columns: minmax(0, 1fr); }
    .lanes > .ticks { grid-row: 2; }
    .lanes > :last-child { display: none; }
    .head { grid-template-columns: minmax(0, 1fr) auto; }
    .head .trk { grid-column: 1 / -1; grid-row: 2; }
    .info { margin: 0 14px; padding-left: 0; }
  }
  @media (prefers-reduced-motion: reduce) { * { transition: none !important; } }
</style>
</head>
<body>
<header>
  <div class="title">
    <h1 data-t="agents">Agenci</h1>
    <div class="summary" id="summary"></div>
  </div>
  <div class="bar">
    <div class="group" role="group" aria-label="Układ listy" data-t-aria="layout">
      <button type="button" data-group="host" data-icon="host" title="Według maszyny" data-t-title="byHost"><span class="lbl" data-t="host">maszyna</span></button>
      <button type="button" data-group="project" data-icon="project" title="Według projektu" data-t-title="byProject"><span class="lbl" data-t="project">projekt</span></button>
      <button type="button" data-group="queue" data-icon="queue" title="Kolejka: najpierw to, co czeka na Ciebie" data-t-title="byQueue"><span class="lbl" data-t="queue">kolejka</span></button>
    </div>
    <div class="group range" role="group" aria-label="Zakres osi czasu" data-t-aria="range">
      <button type="button" data-range="15m" title="Ostatnie 15 minut" data-t-title="range15m">15m</button>
      <button type="button" data-range="1h" title="Ostatnia godzina" data-t-title="range1h">1h</button>
      <button type="button" data-range="4h" title="Ostatnie 4 godziny" data-t-title="range4h">4h</button>
      <button type="button" data-range="12h" title="Ostatnie 12 godzin" data-t-title="range12h">12h</button>
    </div>
    <div class="group" role="group" aria-label="Narzędzia" data-t-aria="tools">
      <button type="button" id="theme" data-icon="theme"></button>
      <button type="button" id="lang" class="lang"></button>
      <button type="button" id="sound" data-icon="sound-off" aria-pressed="false"></button>
      <a class="btn" href="/stats" data-icon="chart" title="Statystyki" aria-label="Statystyki" data-t-title="stats" data-t-aria="stats"></a>
      <div class="more">
        <button type="button" id="more" data-icon="more" title="Więcej" aria-label="Więcej" data-t-title="more" data-t-aria="more" aria-expanded="false" aria-controls="menu"></button>
        <div class="menu" id="menu" role="menu" hidden>
          <div class="menu-range" role="group" aria-label="Zakres osi czasu" data-t-aria="range">
            <span data-t="timeline">oś czasu</span>
            <button type="button" data-range="15m">15m</button>
            <button type="button" data-range="1h">1h</button>
            <button type="button" data-range="4h">4h</button>
            <button type="button" data-range="12h">12h</button>
          </div>
          <div class="menu-range menu-lang" role="group" aria-label="Język" data-t-aria="language">
            <span data-t="language">język</span>
            <button type="button" data-lang="pl" lang="pl" title="Polski">PL</button>
            <button type="button" data-lang="en" lang="en" title="English">EN</button>
          </div>
          <button type="button" role="menuitemcheckbox" id="show-ended" data-icon="eye"><span data-t="showEnded">pokaż zakończone</span></button>
          <button type="button" role="menuitem" id="clear-ended" data-icon="trash"><span data-t="clearEnded">usuń zakończone z listy</span></button>
          <button type="button" role="menuitemcheckbox" id="notify" data-icon="bell" aria-pressed="false"><span data-t="notifications">powiadomienia</span></button>
          <button type="button" role="menuitemcheckbox" id="awake" data-icon="sun" aria-pressed="false"><span data-t="awake">nie wygaszaj ekranu</span></button>
          <button type="button" role="menuitemcheckbox" id="fullscreen" data-icon="expand" aria-pressed="false"><span data-t="fullscreen">pełny ekran</span></button>
          <div class="menu-legend" aria-hidden="true">
            <span><i class="s-waiting"></i><span data-t="st.waiting">czeka na Ciebie</span></span>
            <span><i class="s-working"></i><span data-t="st.working">pracuje</span></span>
            <span><i class="s-error"></i><span data-t="st.error">błąd</span></span>
            <span><i class="s-stale"></i><span data-t="st.stale">brak sygnału</span></span>
            <span><i class="s-idle"></i><span data-t="st.idle">gotowy</span></span>
          </div>
        </div>
      </div>
    </div>
  </div>
</header>
<button type="button" id="beacon" class="beacon" hidden></button>
<div id="machines" class="machines" hidden></div>

// t("key", ...args): the text in the current language (a function entry gets the args).
function t(key, ...args) {
  const v = TEXT[lang][key] ?? TEXT.pl[key];
  return typeof v === "function" ? v(...args) : v ?? key;
}
// Fixed Polish parts of what the server sends, for English display only. The server keeps
// them Polish (the statistics match on them); free text after a prefix stays as it is.
const SERVER_EN = [
  ["zgoda: ", "permission: "], ["pytanie: ", "question: "], ["pytanie", "question"],
  ["decyzja: ", "decision: "], ["odmowa: ", "denied: "], ["błąd narzędzia: ", "tool error: "],
  ["błąd: limit zapytań", "error: rate limit"], ["błąd: przeciążenie API", "error: API overloaded"],
  ["błąd: błąd logowania", "error: authentication failed"], ["błąd: płatności", "error: billing"],
  ["błąd: błąd serwera API", "error: API server error"], ["błąd: za długa odpowiedź", "error: response too long"],
  ["błąd: ", "error: "], ["podagent: ", "subagent: "], ["podagent ", "subagent "], ["podagent", "subagent"],
  ["propozycja sesji: ", "session offer: "], ["propozycja sesji", "session offer"],
  ["plan do akceptacji", "plan awaiting approval"], ["zrobione: ", "done: "],
  ["kompaktuje kontekst", "compacting context"], ["kontekst skompaktowany", "context compacted"],
  ["skończył", "finished"], ["ponawia ", "retrying "],
  ["przerwane przez Ciebie", "interrupted by you"], ["przerwane: zamknięcie OpenCode", "interrupted: OpenCode shut down"],
  ["przerwane: nowe polecenie", "interrupted: new prompt"], ["przerwane: brak aktywności", "interrupted: inactivity"],
  ["przerwane: ", "interrupted: "], ["przerwane", "interrupted"],
  ["limit: wznowiono automatycznie", "limit: resumed automatically"],
  ["limit minął: naciśnij Enter, by wznowić", "limit over: press Enter to resume"],
  ["limit: bez automatycznego wznowienia", "limit: no automatic resume"],
  ["narzędzie: ", "tool: "], ["narzędzie", "tool"],
].sort((a, b) => b[0].length - a[0].length);
function srv(s) {
  if (lang === "pl" || !s) return s;
  for (const [pl, en] of SERVER_EN) {
    // A whole word only: "podagent" must not turn "podagenty skończyły" into English halves.
    if (s.startsWith(pl) && (s.length === pl.length || /[\s:]$/.test(pl) || /^[\s:(—,]/.test(s.slice(pl.length)))) {
      return en + s.slice(pl.length);
    }
  }
  return s;
}
const locale = () => lang === "en" ? "en-GB" : "pl-PL";
// Texts written into the page's own markup: data-t (text), data-t-title, data-t-aria.
function applyStatic() {
  document.documentElement.lang = lang;
  document.title = t("agents");   // render() puts the waiting count in front again
  for (const e of document.querySelectorAll("[data-t]")) e.textContent = t(e.dataset.t);
  for (const e of document.querySelectorAll("[data-t-title]")) e.title = t(e.dataset.tTitle);
  for (const e of document.querySelectorAll("[data-t-aria]")) e.setAttribute("aria-label", t(e.dataset.tAria));
}

// Dark or light, chosen here and remembered on this device (the stats page reads the same).
const themeBtn = document.getElementById("theme");
function showTheme() {
  const dark = document.documentElement.dataset.theme !== "light";
  themeBtn.title = t(dark ? "themeDark" : "themeLight");
  themeBtn.setAttribute("aria-label", t(dark ? "toLight" : "toDark"));
}
themeBtn.addEventListener("click", () => {
  const next = document.documentElement.dataset.theme === "light" ? "dark" : "light";
  document.documentElement.dataset.theme = next;
  try { localStorage.setItem("theme", next); } catch {}
  showTheme();
});
showTheme();

// The language button shows the language in use; a tap switches to the other one and
// redraws everything at once. On a narrow phone the same choice sits in the menu.
const langBtn = document.getElementById("lang");
function showLang() {
  langBtn.textContent = lang.toUpperCase();
  langBtn.title = t("langTitle");
  langBtn.setAttribute("aria-label", t("langAria"));
  for (const b of document.querySelectorAll("[data-lang]")) b.setAttribute("aria-pressed", String(b.dataset.lang === lang));
}
function setLang(l) {
  lang = l;
  try { localStorage.setItem("lang", l); } catch {}
  applyStatic();
  showLang();
  showTheme();
  showSound();
  showAwake();
  showNotify();
  lastSig = "";   // rebuild the list, not just tick the ages
  paint();
}
langBtn.addEventListener("click", () => setLang(lang === "pl" ? "en" : "pl"));
for (const b of document.querySelectorAll("[data-lang]")) b.addEventListener("click", () => setLang(b.dataset.lang));
applyStatic();
showLang();

// The "more" menu: opens under its button, closes on a choice elsewhere or Escape.
const moreBtn = document.getElementById("more"), menu = document.getElementById("menu");
function openMenu(open) {
  menu.hidden = !open;
  moreBtn.setAttribute("aria-expanded", String(open));
}
moreBtn.addEventListener("click", () => openMenu(menu.hidden));
document.addEventListener("click", e => { if (!menu.hidden && !e.target.closest(".more")) openMenu(false); });
document.addEventListener("keydown", e => { if (e.key === "Escape" && !menu.hidden) { openMenu(false); moreBtn.focus(); } });
// Actions that leave the page state obvious close the menu; switches keep it open.
for (const id of ["clear-ended", "fullscreen"]) document.getElementById(id).addEventListener("click", () => openMenu(false));

// State names: full (legend, tooltips, history) and short (the state column).
const LABEL = st => TEXT.pl["st." + st] ? t("st." + st) : st;
const SHORT = st => st === "waiting" ? t("short.waiting") : LABEL(st);
const AGENT = { claude: "Claude Code", opencode: "OpenCode" };
const MIN = 60e3, HOUR = 60 * MIN;
// Window width and grid step of the strips.
const RANGES = {
  "15m": { ms: 15 * MIN, step: 5 * MIN },
  "1h": { ms: HOUR, step: 10 * MIN },
  "4h": { ms: 4 * HOUR, step: HOUR },
  "12h": { ms: 12 * HOUR, step: 2 * HOUR },
};
// Queue lanes, most urgent first.
const LANES = [
  { id: "waiting", has: s => s.state === "waiting" },
  { id: "check", has: s => s.state === "error" || s.stale },
  { id: "working", has: s => s.state === "working" && !s.stale },
  { id: "idle", has: s => s.state === "idle" },
  { id: "ended", has: s => s.state === "ended" },
];

function ago(iso, now) {
  const s = Math.max(0, Math.round((now - new Date(iso)) / 1000));
  if (s < 60) return s + " s";
  if (s < 3600) return Math.floor(s / 60) + " min";
  return Math.floor(s / 3600) + " h " + Math.floor((s % 3600) / 60) + " min";
}

function el(tag, cls, text) {
  const e = document.createElement(tag);
  if (cls) e.className = cls;
  if (text != null) e.textContent = text;
  return e;
}

const NO_PROJECT = "bez projektu";   // a group key; shown as t("noProject")

// Names given to machines on this page, keyed by the name agents report.
let hostNames = {};
const hostLabel = h => hostNames[h] || h;

let groupBy = "host";
try { const g = localStorage.getItem("groupBy"); if (g === "project" || g === "queue") groupBy = g; } catch {}

function setGroup(g) {
  groupBy = g;
  try { localStorage.setItem("groupBy", g); } catch {}
  for (const b of document.querySelectorAll("[data-group]")) b.setAttribute("aria-pressed", String(b.dataset.group === g));
  paint();
}
for (const b of document.querySelectorAll("[data-group]")) b.addEventListener("click", () => setGroup(b.dataset.group));

let range = "1h";
try { const r = localStorage.getItem("range"); if (RANGES[r]) range = r; } catch {}

function setRange(r) {
  range = r;
  try { localStorage.setItem("range", r); } catch {}
  for (const b of document.querySelectorAll("[data-range]")) b.setAttribute("aria-pressed", String(b.dataset.range === r));
  paint();
}
for (const b of document.querySelectorAll("[data-range]")) b.addEventListener("click", () => setRange(b.dataset.range));

const MODE = m => TEXT.pl["mode." + m] ? t("mode." + m) : m;
const expanded = new Set();   // keys of sessions whose details are open
try { for (const k of JSON.parse(sessionStorage.getItem("expanded") || "[]")) expanded.add(k); } catch {}

function toggle(key) {
  if (expanded.has(key)) expanded.delete(key); else expanded.add(key);
  try { sessionStorage.setItem("expanded", JSON.stringify([...expanded])); } catch {}
  paint();
}

const clock = iso => new Date(iso).toLocaleTimeString(locale(), { hour: "2-digit", minute: "2-digit", second: "2-digit" });
const hm = ms => new Date(ms).toLocaleTimeString(locale(), { hour: "2-digit", minute: "2-digit" });
const sameDay = (a, b) => a.toDateString() === b.toDateString();
function when(iso, now) {
  const d = new Date(iso);
  const day = sameDay(d, now) ? "" : d.toLocaleDateString(locale(), { day: "numeric", month: "short" }) + " ";
  return day + clock(iso) + " (" + ago(iso, now) + t("ago") + ")";
}

function details(s, now) {
  const box = el("div", "info");
  const dl = el("dl");
  const item = (label, value, code) => {
    if (!value) return;
    const dd = el("dd");
    dd.append(code ? el("code", null, value) : value);
    dl.append(el("dt", null, t(label)), dd);
  };
  item("dir", s.cwd, true);
  item("machine", hostNames[s.host] ? hostNames[s.host] + " (" + s.host + ")" : s.host);
  item("agent", AGENT[s.agent] || s.agent);
  item("model", s.model);
  item("mode", s.mode && MODE(s.mode));
  item("session", s.sessionId, true);
  item("started", s.startedAt && when(s.startedAt, now));
  item("lastSignal", when(s.updatedAt, now) + (s.lastEvent ? " · " + s.lastEvent : ""));
  const counts = [];
  if (s.prompts) counts.push(t("nPrompts", s.prompts));
  if (s.toolCalls) counts.push(t("nToolCalls", s.toolCalls));
  if (s.permissions) counts.push(t("nPermissions", s.permissions));
  if (s.toolFailures) counts.push(t("nToolErrors", s.toolFailures));
  if (s.subagentRuns) counts.push(t("nSubagents", s.subagentRuns));
  if (s.compactions) counts.push(t("nCompactions", s.compactions));
  item("activity", counts.join(" · "));
  if (s.todosTotal) item("tasks", t("todosDone", s.todosDone || 0, s.todosTotal));
  if (s.contextPct != null) {
    item("context", Math.round(s.contextPct) + "%" +
      (s.contextTokens ? " (" + t("tokens", Math.round(s.contextTokens / 1000), Math.round((s.contextLimit || 0) / 1000)) + ")" : ""));
  }
  if (s.costUsd) item("cost", "$" + s.costUsd.toFixed(2));
  if (s.linesAdded || s.linesRemoved) item("codeChanges", t("lines", s.linesAdded || 0, s.linesRemoved || 0));
  if (s.subagents && s.subagents.length) {
    item("subagentsNow", s.subagents.map(a => (a.type || t("subagent")) + " (" + t("since", ago(a.since, now)) + ")").join(", "));
  }
  box.append(dl);

  const block = (title, node) => { box.append(el("h3", null, t(title)), node); };
  if (s.tools && Object.keys(s.tools).length) {
    const tools = el("div", "tools");
    for (const [name, n] of Object.entries(s.tools).sort((a, b) => b[1] - a[1] || a[0].localeCompare(b[0]))) {
      const chip = el("span", null, name);
      chip.append(el("b", null, String(n)));
      tools.append(chip);
    }
    block("toolsUsed", tools);
  }
  if (s.lastPrompt) block("lastPrompt", el("p", "text", s.lastPrompt));
  if (s.lastMessage) block(s.state === "error" ? "lastError" : "lastReply", el("p", "text", s.lastMessage));
  if (s.history && s.history.length) {
    const ul = el("ul", "history");
    for (const h of [...s.history].reverse()) {
      const li = el("li");
      const time = el("time", null, clock(h.at));
      time.dateTime = h.at;
      const msg = el("div", "msg");
      if (h.state) msg.append(el("span", "st " + h.state, LABEL(h.state)));
      msg.append(h.detail ? srv(h.detail) : el("span", "kind", h.kind));
      li.title = h.kind;
      li.append(time, msg);
      ul.append(li);
    }
    block("history", ul);
  }
  const actions = el("div", "actions");
  const del = el("button", null, t("remove"));
  del.type = "button";
  del.dataset.remove = s.key;
  del.title = t("removeTitle");
  const ren = el("button", null, t("renameMachine"));
  ren.type = "button";
  ren.dataset.rename = s.host;
  ren.title = t("renameTitle", s.host);
  actions.append(ren, del);
  box.append(actions);
  return box;
}

// State spans of a session as [from, to, state] in epoch ms; to = null means "until now".
// Older servers send no timeline, so fall back to the state changes in the short history.
function spans(s) {
  let tl = s.timeline && s.timeline.length ? s.timeline
    : (s.history || []).filter(h => h.state).map(h => ({ at: h.at, state: h.state }));
  const out = [];
  for (let i = 0; i < tl.length; i++) {
    const from = Date.parse(tl[i].at);
    const to = i + 1 < tl.length ? Date.parse(tl[i + 1].at) : null;
    const st = tl[i].state;
    if (st === "ended") continue;   // the strip simply stops where the session ended
    if (to === null && s.stale) {
      // Working, but silent: solid up to the last signal, hatched after it.
      const last = Date.parse(s.updatedAt);
      out.push([from, last, st], [last, null, "stale"]);
    } else {
      out.push([from, to, st]);
    }
  }
  return out;
}

// Positions a span on the strip for the current window; hides it when outside.
function place(i, now) {
  const win = RANGES[range].ms, start = now - win;
  const a = Math.max(+i.dataset.a, start);
  const b = i.dataset.b ? Math.min(+i.dataset.b, now) : now;
  if (b <= a) { i.hidden = true; return; }
  i.hidden = false;
  i.style.left = (100 * (a - start) / win) + "%";
  i.style.width = (100 * (b - a) / win) + "%";
}

function strip(s, now) {
  const box = el("div", "strip");
  for (const [a, b, st] of spans(s)) {
    const i = el("i", "s-" + st);
    i.dataset.a = a;
    i.dataset.b = b == null ? "" : b;
    i.title = LABEL(st) + " · " + hm(a) + "–" + (b == null ? t("now") : hm(b));
    place(i, now);
    box.append(i);
  }
  box.append(el("i", "now"));
  return box;
}

function ticks() {
  const { ms, step } = RANGES[range];
  const box = el("div", "ticks");
  box.setAttribute("aria-hidden", "true");
  for (let d = ms; d >= 0; d -= step) {
    const label = d === 0 ? t("now") : "−" + (d >= HOUR ? d / HOUR + " h" : d / MIN + " min");
    // On a narrow screen only the ends and the middle keep their labels.
    const sp = el("span", d === ms ? "first" : d === 0 ? "last" : d * 2 === ms ? "mid" : null, label);
    sp.style.left = (100 * (ms - d) / ms) + "%";
    box.append(sp);
  }
  return box;
}

let showEnded = true;
try { showEnded = localStorage.getItem("showEnded") !== "0"; } catch {}

function setShowEnded(v) {
  showEnded = v;
  try { localStorage.setItem("showEnded", v ? "1" : "0"); } catch {}

document.getElementById("show-ended").addEventListener("click", () => setShowEnded(!showEnded));

    if (!r.ok) throw new Error(r.status);
  } catch {
    alert(t("removeFailed"));

document.getElementById("clear-ended").addEventListener("click", () => {
  const n = lastData ? lastData.sessions.filter(s => s.state === "ended").length : 0;
  if (n === 0) return;
  if (confirm(t("clearConfirm", n))) {
    removeSessions("ended=1");
  }
});

// nested: drawn right under its parent session (an OpenCode subagent).
function row(s, now, nested) {
  const isOpen = expanded.has(s.key);
  const cls = s.stale ? "stale" : s.state;
  const r = el("div", "row " + cls + (isOpen ? " open" : "") + (nested ? " child" : ""));
  const head = el("div", "head");
  head.tabIndex = 0;
  head.setAttribute("role", "button");
  head.setAttribute("aria-expanded", String(isOpen));
  head.dataset.key = s.key;
  if (!isOpen) head.title = t("clickDetails");

  const agent = AGENT[s.agent] || s.agent;
  const name = s.project || s.sessionId.slice(0, 8);
  const host = hostLabel(s.host);
  let [title, sub] = groupBy === "project" ? [host, agent]
    : groupBy === "queue" ? [name, host + " · " + agent]
    : [name, agent];
  if (s.parentKey) {
    // A subagent's session: named by what it does, and whose it is when not nested.
    const parent = lastData && lastData.sessions.find(p => p.key === s.parentKey);
    // The task is the title; the agent type goes underneath, so a narrow screen keeps the task.
    title = s.task || s.subagentType || name;
    const kind = s.subagentType ? t("subagent") + " " + s.subagentType : t("subagent");
    sub = nested ? kind
      : t("subagentOf", kind, parent ? parent.project || parent.sessionId.slice(0, 8) : "?") + " · " + host;
  }
  const who = el("div", "who");
  who.append(el("b", null, title), el("span", null, sub));

  const trk = el("div", "trk");
  trk.append(strip(s, now));
  const chips = rowChips(s, now);
  const task = s.parentKey ? "" : s.task;   // a subagent's task is already its title
  if (task || s.detail || chips.length) {
    const cap = el("div", "cap");
    cap.append(...chips);
    if (task) cap.append(el("span", "task", task));
    if (s.detail) cap.append(el("span", "detail", srv(s.detail)));
    trk.append(cap);
  }
  const lines = s.state === "ended" ? null : subLines(s, now);
  if (lines) trk.append(lines);

  const st = el("div", "state " + cls, SHORT(cls));
  st.title = LABEL(cls);
  // Waiting, failed or done: how long it has been like that. Working: when it last reported,
  // which is what tells a busy session from a silent one.
  st.append(SINCE[cls] ? ageEl("small", since(s), now, t("for")) : ageEl("small", s.updatedAt, now, "", t("ago")));

  head.append(who, trk, st);
  r.append(head);
  if (isOpen) r.append(details(s, new Date(now)));
  return r;
}

// States whose row shows "since when" rather than "last signal".
const SINCE = { waiting: true, error: true, idle: true };

// When the session entered its current state: the last state change on its timeline.
function since(s) {
  const tl = s.timeline;
  return tl && tl.length && tl[tl.length - 1].state === s.state ? tl[tl.length - 1].at : s.updatedAt;
}

// A time that paint() keeps counting between data changes: pre + "7 min" + post.
function ageEl(tag, at, now, pre, post) {
  const e = el(tag, null, (pre || "") + ago(at, now) + (post || ""));
  e.dataset.at = at;
  if (pre) e.dataset.pre = pre;
  if (post) e.dataset.post = post;
  return e;
}

// Small labels in front of the caption: running subagents and task-list progress.
function rowChips(s, now) {
  const out = [];
  const subs = s.subagents || [];
  if (subs.length) {
    // Each one has its own line under the row (subLines); the chip only counts them.
    out.push(el("span", "chip sub", t("nSubagents", subs.length)));
  }
  if (s.todosTotal) out.push(el("span", "chip", t("todosChip", s.todosDone || 0, s.todosTotal)));
  // Context window use (from the statusline script): worth a look before auto-compaction.
  if (s.contextPct != null && s.state !== "ended") {
    const pct = Math.round(s.contextPct);
    const c = el("span", "chip" + (pct >= 85 ? " hot" : pct >= 70 ? " warm" : ""), t("contextChip", pct));
    c.title = s.contextTokens ? t("tokens", Math.round(s.contextTokens / 1000), Math.round((s.contextLimit || 0) / 1000)) : "";
    out.push(c);
  }
  return out;
}

// One line per running subagent: its type, the task it was started for, what it is doing
// now and for how long it has run. OpenCode subagents have rows of their own instead.
function subLines(s, now) {
  const own = new Set((lastData ? lastData.sessions : []).map(x => x.key));
  const subs = (s.subagents || []).filter(a => !own.has(s.agent + "/" + s.host + "/" + a.id));
  if (!subs.length) return null;
  const box = el("ul", "subs");
  for (const a of [...subs].sort((x, y) => x.since.localeCompare(y.since) || x.id.localeCompare(y.id))) {
    const li = el("li");
    const what = el("span", "what");
    what.append(el("span", "type", a.type || t("subagent")));
    what.append(el("b", null, a.desc || "—"));
    if (a.doing) what.append(el("span", "doing", srv(a.doing)));
    li.append(what, ageEl("small", a.since, now));
    const quiet = now - Date.parse(a.lastSeen || a.since);
    li.title = (a.calls ? t("nToolCalls", a.calls) + " · " : "") + t("lastSeen", ago(a.lastSeen || a.since, now));
    if (quiet > 3 * MIN) li.className = "quiet";   // no tool call for a while: thinking or stuck
    box.append(li);
  }
  return box;
}

// host: set when the section is one machine, so its name can be changed from the header.
// longestFirst: order by how long the sessions have been in their state (the waiting lane).
// foldKey: names the section for its folded lines, the same in either language.
function section(name, count, list, now, cls, host, longestFirst, foldKey) {
  const sec = el("section", cls);
  const h = el("h2", "lanes");
  const n = el("span", "name", name);
  n.append(el("small", null, count));
  if (host != null) {
    if (hostNames[host]) n.title = host;
    const m = machines.get(host);
    if (m) n.append(machineState(m, now, "host-state"));
    const ren = el("button", "rename", t("rename"));
    ren.type = "button";
    ren.dataset.rename = host;
    ren.setAttribute("aria-label", t("renameAria", name));
    n.append(ren);
  }
  h.append(n, ticks(), el("span"));
  sec.append(h);
  // Fixed order (newest session first) so rows don't swap places whenever an agent reports.
  // The waiting lane goes by who has waited longest; that order only changes when one stops waiting.
  const order = longestFirst
    ? (a, b) => since(a).localeCompare(since(b)) || a.key.localeCompare(b.key)
    : (a, b) => b.startedAt.localeCompare(a.startedAt) || a.key.localeCompare(b.key);
  // Done or ended for over an hour: folded into one line at the bottom, so a small screen
  // shows what is going on now. An open session stays out, it was opened for a reason.
  const sorted = [...list].sort(order);
  // A subagent's own session (OpenCode) goes right under its parent when the parent is
  // in this section; otherwise it stands alone and says whose it is.
  const keys = new Set(sorted.map(s => s.key));
  const kids = new Map();
  for (const s of sorted) {
    if (s.parentKey && keys.has(s.parentKey)) {
      if (!kids.has(s.parentKey)) kids.set(s.parentKey, []);
      kids.get(s.parentKey).push(s);
    }
  }
  const top = sorted.filter(s => !(s.parentKey && keys.has(s.parentKey)));
  // Subagents that are done fold into one line after a minute; open ones stay out.
  const done = c => (c.state === "ended" || c.state === "idle") && !expanded.has(c.key) && now - Date.parse(since(c)) > MIN;
  const withKids = s => {
    const all = kids.get(s.key) || [];
    const gone = all.filter(done);
    const out = [row(s, now), ...all.filter(c => !gone.includes(c)).map(c => row(c, now, true))];
    if (gone.length) {
      const id = "kids|" + s.key;
      const open = openOld.has(id);
      const b = el("button", "older kids", (open ? "▾ " : "▸ ") + "✓ " + t("kidsDone", gone.length));
      b.type = "button";
      b.dataset.older = id;
      b.setAttribute("aria-expanded", String(open));
      out.push(b);
      if (open) out.push(...gone.map(c => row(c, now, true)));
    }
    return out;
  };
  const old = top.filter(s => isOld(s, now) && !expanded.has(s.key));
  const fold = old.length >= 2 ? old : [];
  for (const s of top) if (!fold.includes(s)) sec.append(...withKids(s));
  if (fold.length) {
    const id = (cls || "") + "|" + (host ?? foldKey ?? name);
    const open = openOld.has(id);
    const b = el("button", "older", (open ? "▾ " : "▸ ") + t("older", fold.length));
    b.type = "button";
    b.dataset.older = id;
    b.setAttribute("aria-expanded", String(open));
    b.append(el("small", null, t("olderNote")));
    sec.append(b);
    if (open) for (const s of fold) sec.append(...withKids(s));
  }
  return sec;
}

const OLD_MS = 60 * MIN;
const isOld = (s, now) => (s.state === "idle" || s.state === "ended") && now - Date.parse(since(s)) > OLD_MS;

// Sections whose old sessions are unfolded, kept for this tab like the open details.
const openOld = new Set();
try { for (const k of JSON.parse(sessionStorage.getItem("openOld") || "[]")) openOld.add(k); } catch {}
function toggleOld(id) {
  if (openOld.has(id)) openOld.delete(id); else openOld.add(id);
  try { sessionStorage.setItem("openOld", JSON.stringify([...openOld])); } catch {}
  lastSig = "";
  paint();
}

// Machines that send a heartbeat (installer adds it), keyed by the name agents report.
let machines = new Map();

// "● online od 3 h" / "○ offline od 12 min" ("online for 3 h" in English): the dot is the state, the time says since when.
function machineState(m, now, cls) {
  const sp = el("span", cls);
  sp.append(el("i", "dot" + (m.online ? "" : " off")));
  sp.append(m.online ? "online " : "offline ");
  sp.append(ageEl("small", m.online ? m.firstBeat : m.lastBeat, now, t("for")));
  sp.title = (m.online ? t("heartbeat") : t("noHeartbeat", clock(m.lastBeat))) + (m.ip ? " · " + m.ip : "");
  return sp;
}

// One line with every machine: offline ones first, they are the news.
function renderMachines(now) {
  const box = document.getElementById("machines");
  const list = [...machines.values()].sort((a, b) => a.online - b.online || hostLabel(a.host).localeCompare(hostLabel(b.host)));
  box.hidden = list.length === 0;
  box.replaceChildren();
  for (const m of list) {
    const sp = el("span");
    sp.append(el("i", "dot" + (m.online ? "" : " off")), el("span", m.online ? null : "off-name", hostLabel(m.host) + " "));
    sp.append(m.online ? el("small", null, "online") : ageEl("small", m.lastBeat, now, t("offlineFor")));
    sp.title = m.ip || "";
    box.append(sp);
  }
}

function render(data) {
  if (!showEnded) data = { ...data, sessions: data.sessions.filter(s => s.state !== "ended") };
  hostNames = data.hostNames || {};
  machines = new Map((data.machines || []).map(m => [m.host, m]));
  const now = new Date(data.now).getTime();
  const hosts = document.getElementById("hosts");
  hosts.replaceChildren();
  hosts.style.setProperty("--n", RANGES[range].ms / RANGES[range].step);
  if (data.sessions.length === 0) {
    hosts.append(el("div", "empty", t("noSessions")));
  }
  if (groupBy === "queue") {
    // A subagent sits in its parent's lane, under it, unless it needs you itself.
    const byKey = new Map(data.sessions.map(s => [s.key, s]));
    const laneOf = s => {
      const p = s.parentKey && byKey.get(s.parentKey);
      const own = LANES.find(l => l.has(s));
      if (!p || own.id === "waiting" || own.id === "check") return own;
      return LANES.find(l => l.has(p));
    };
    for (const lane of LANES) {
      const list = data.sessions.filter(s => laneOf(s) === lane);
      if (list.length) hosts.append(section(t("lane." + lane.id), String(list.length), list, now, "q-" + lane.id, null, lane.id === "waiting", lane.id));
    }
  } else {
    const byProject = groupBy === "project";
    const groups = new Map();
    for (const s of data.sessions) {
      const k = byProject ? (s.project || NO_PROJECT) : s.host;
      if (!groups.has(k)) groups.set(k, []);
      groups.get(k).push(s);
    }
    // Alphabetical by shown name, so sections don't jump around on every refresh; "bez projektu" goes last.
    const label = k => byProject ? (k === NO_PROJECT ? t("noProject") : k) : hostLabel(k);
    const order = ([a], [b]) => (a === NO_PROJECT) - (b === NO_PROJECT) || label(a).localeCompare(label(b)) || a.localeCompare(b);
    for (const [key, list] of [...groups].sort(order)) {
      const active = t("active", list.filter(s => s.state !== "ended").length);
      hosts.append(section(label(key), active, list, now, null, byProject ? null : key, false, key));
    }
  }
  const waiting = data.sessions.filter(s => s.state === "waiting").length;
  const working = data.sessions.filter(s => s.state === "working").length;
  const summary = document.getElementById("summary");
  summary.replaceChildren();
  const w = el("b", waiting ? "signal" : null, String(waiting));
  summary.append(...t("summary", w, el("b", null, String(working))));
  document.title = waiting ? `(${waiting}) ` + t("agents") : t("agents");
  renderMachines(now);
  alarm(data.sessions);
}

// Frame around the screen and the big line on top: what needs you, readable at a glance.
function alarm(sessions) {
  const waiting = sessions.filter(s => s.state === "waiting");
  const check = sessions.filter(s => s.state === "error" || (s.stale && s.state !== "ended"));
  const list = waiting.length ? waiting : check;
  document.body.classList.toggle("alarm-waiting", waiting.length > 0);
  document.body.classList.toggle("alarm-check", !waiting.length && check.length > 0);
  const b = document.getElementById("beacon");
  b.hidden = list.length === 0;
  if (!list.length) return;
  const n = list.length;
  const now = lastData ? new Date(lastData.now).getTime() + (Date.now() - lastFetch) : Date.now();
  b.className = "beacon" + (waiting.length ? "" : " check");
  const head = el("span", null, t(waiting.length ? "beaconWaiting" : "beaconCheck", n));
  if (waiting.length) {
    const oldest = waiting.map(since).sort()[0];
    head.append(" · ", ageEl("span", oldest, now, t("longestFor")));
  }
  const names = [...list].sort((a, c) => since(a).localeCompare(since(c)))
    .map(s => (s.parentKey ? t("subagentIn", s.subagentType || t("subagent")) : "") + (s.project || s.sessionId.slice(0, 8)) + " (" + hostLabel(s.host) + ")");
  b.replaceChildren(head, el("small", null, names.join(" · ")));
  b.title = t("showQueue");
}
document.getElementById("beacon").addEventListener("click", () => {
  setGroup("queue");
  window.scrollTo({ top: 0 });
});

const REFRESH_MS = 3000;
let lastData = null;   // last payload, re-rendered every second so "ago" keeps counting
let lastFetch = 0;     // client time of the last successful fetch
let inFlight = false;
let timer = 0;

let lastSig = "";      // what the DOM currently shows; rebuilt only when this changes
let selectedAt = 0;    // when the text selection last changed
document.addEventListener("selectionchange", () => { selectedAt = Date.now(); });

function paint() {
  if (!lastData) return;
  const hostsEl = document.getElementById("hosts");
  // Shift the server's "now" by the time elapsed since the fetch, so ages stay live between polls.
  const elapsed = Date.now() - lastFetch;
  const now = new Date(new Date(lastData.now).getTime() + elapsed);
  const sig = JSON.stringify([lastData.sessions, lastData.hostNames, lastData.machines, groupBy, range, showEnded, [...expanded]]);
  const sel = window.getSelection();
  // Re-rendering would drop a text selection, so it waits while someone copies text from the
  // open details (paths, prompts). A stray selection in a row (double-click) never blocks it,
  // and any selection only holds it for a while, so the list can't freeze.
  const anchor = sel && sel.anchorNode && (sel.anchorNode.nodeType === 1 ? sel.anchorNode : sel.anchorNode.parentElement);
  const selecting = sel && sel.toString().trim() !== "" && anchor && anchor.closest("#hosts .info") &&
    Date.now() - selectedAt < 15000;
  if (sig !== lastSig && !selecting) {
    const focusedKey = document.activeElement && document.activeElement.dataset ? document.activeElement.dataset.key : null;
    render({ ...lastData, now: now.toISOString() });
    lastSig = sig;
    if (focusedKey) {
      const again = [...hostsEl.querySelectorAll(".head")].find(h => h.dataset.key === focusedKey);
      if (again) again.focus({ preventScroll: true });
    }
  } else {
    // Nothing changed: only tick the ages and slide the strips, leaving the DOM (hover, focus, selection) alone.
    for (const e of document.querySelectorAll("#hosts [data-at], #beacon [data-at], #machines [data-at]")) {
      e.textContent = (e.dataset.pre || "") + ago(e.dataset.at, now) + (e.dataset.post || "");
    }
    for (const i of hostsEl.querySelectorAll(".strip i[data-a]")) place(i, now.getTime());
  }
  // No ticking "refreshed N s ago" in the header (it shifted the layout every second);
  // speak up only when data is actually old.
  const s = Math.round(elapsed / 1000);
  const late = document.getElementById("late");
  late.hidden = s < 10 || !document.getElementById("offline").hidden;
  late.textContent = t("late", s);
}

async function tick() {
  clearTimeout(timer);
  if (inFlight) return;
  inFlight = true;
  try {
    const ctrl = new AbortController();
    const guard = setTimeout(() => ctrl.abort(), 5000);
    const r = await fetch("/api/sessions", { cache: "no-store", signal: ctrl.signal });
    clearTimeout(guard);
    if (!r.ok) throw new Error(r.status);
    lastData = await r.json();
    lastFetch = Date.now();
    watch(lastData.sessions);
    document.getElementById("offline").hidden = true;
  } catch {
    document.getElementById("offline").hidden = false;
  } finally {
    inFlight = false;
    paint();
    timer = setTimeout(tick, REFRESH_MS);
  }
}

// Background tabs throttle timers; catch up as soon as the page is visible again.
document.addEventListener("visibilitychange", () => { if (!document.hidden) tick(); });
window.addEventListener("focus", tick);
window.addEventListener("online", tick);
// One delegated listener: rows are rebuilt whenever the data changes.
const hostsRoot = document.getElementById("hosts");
hostsRoot.addEventListener("click", e => {
  const rm = e.target.closest("[data-remove]");
  if (rm) {
    expanded.delete(rm.dataset.remove);
    removeSessions("key=" + encodeURIComponent(rm.dataset.remove));
    return;
  }
  const older = e.target.closest("[data-older]");
  if (older) {
    toggleOld(older.dataset.older);
    return;
  }
  const ren = e.target.closest("[data-rename]");
  if (ren) {
    renameHost(ren.dataset.rename);
    return;
  }
  const head = e.target.closest(".head");
  if (!head) return;
  const sel = window.getSelection();
  if (sel && !sel.isCollapsed) return;   // finishing a text selection, not a click
  toggle(head.dataset.key);
});
hostsRoot.addEventListener("keydown", e => {
  const head = e.target.closest(".head");
  if (!head || (e.key !== "Enter" && e.key !== " ")) return;
  e.preventDefault();
  toggle(head.dataset.key);
});
// Browser notifications: a session starts waiting for you, fails, goes silent while working,
// or finishes its work. Only changes seen while the page is open count; the first load sets the baseline.
const ALERT = { waiting: true, error: true, stale: true, idle: true };   // titles: t("alert." + state)
const canNotify = "Notification" in window && window.isSecureContext;
let notifyOn = false;
try { notifyOn = localStorage.getItem("notify") === "1"; } catch {}
let seen = null;   // session key -> state as shown (stale counts as its own state)

const shownState = s => s.stale ? "stale" : s.state;

function watch(sessions) {
  const prev = seen;
  seen = new Map(sessions.map(s => [s.key, shownState(s)]));
  if (!prev) return;
  const changes = [];
  for (const s of sessions) {
    const now = shownState(s), was = prev.get(s.key);
    if (now === was || !ALERT[now]) continue;
    // "Done" only after actual work, not when an idle session shows up or a question gets dismissed.
    if (now === "idle" && was !== "working" && was !== "stale") continue;
    changes.push([s, now]);
  }
  if (!changes.length) return;
  if (notifyOn && canNotify && Notification.permission === "granted") {
    for (const [s, st] of changes) alertFor(s, st);
  }
  if (soundOn) chime(changes.map(c => c[1]));
}

// Some browser features only work on localhost or over HTTPS. The tablet opens the page by
// the server's LAN address over plain HTTP, so say how to allow it there.
function insecureHelp(what) {
  alert(t("insecure", what, location.origin));
}

// Sound: plays even while you look at the page (the tablet always does), unlike notifications.
// Tones are generated, no audio files. Browsers start audio muted until the page is touched,
// so after a reload the button asks for one tap.
const AudioCtx = window.AudioContext || window.webkitAudioContext;
let soundOn = false;
try { soundOn = localStorage.getItem("sound") === "1"; } catch {}
let audio = null;

function audioCtx() {
  if (!audio && AudioCtx) {
    audio = new AudioCtx();
    audio.onstatechange = showSound;
  }
  return audio;
}

// [frequency Hz, start s, length s] per state, most urgent first.
const CHIMES = {
  waiting: [[660, 0, .25], [880, .18, .45]],
  error: [[392, 0, .3], [294, .25, .5]],
  stale: [[392, 0, .3], [294, .25, .5]],
  idle: [[523, 0, .6]],
};
function chime(states) {
  const ctx = audioCtx();
  if (!ctx || ctx.state !== "running") return;
  const st = Object.keys(CHIMES).find(k => states.includes(k));
  if (!st) return;
  const t0 = ctx.currentTime + .02;
  for (const [f, at, len] of CHIMES[st]) {
    const o = ctx.createOscillator(), g = ctx.createGain();
    o.type = "sine";
    o.frequency.value = f;
    g.gain.setValueAtTime(.0001, t0 + at);
    g.gain.exponentialRampToValueAtTime(.3, t0 + at + .02);
    g.gain.exponentialRampToValueAtTime(.0001, t0 + at + len);
    o.connect(g).connect(ctx.destination);
    o.start(t0 + at);
    o.stop(t0 + at + len + .05);
  }
}

const soundBtn = document.getElementById("sound");
function showSound() {
  const locked = soundOn && (!audio || audio.state !== "running");
  // On and playing: pressed. On but held back by the browser: orange, not pressed, until a tap.
  soundBtn.setAttribute("aria-pressed", String(soundOn && !locked));
  soundBtn.classList.toggle("locked", locked);
  setIcon(soundBtn, soundOn ? "sound" : "sound-off");
  soundBtn.setAttribute("aria-label", t("sound"));
  soundBtn.title = t(locked ? "soundLocked" : soundOn ? "soundOn" : "soundOff");
}
soundBtn.hidden = !AudioCtx;
soundBtn.addEventListener("click", async () => {
  const wasLocked = soundBtn.classList.contains("locked");
  if (soundOn && !wasLocked) {
    soundOn = false;
  } else {
    soundOn = true;
    try { await audioCtx().resume(); } catch {}
    chime(["waiting"]);   // so you hear what it sounds like and how loud
  }
  try { localStorage.setItem("sound", soundOn ? "1" : "0"); } catch {}
  showSound();
});
// Any touch on the page unlocks audio that the browser held back after a reload.
for (const ev of ["pointerdown", "keydown"]) {
  document.addEventListener(ev, () => {
    if (soundOn && audio && audio.state === "suspended") audio.resume().catch(() => {});
  }, true);
}
if (soundOn) audioCtx();
showSound();

// Keep the screen on while the page is visible (Screen Wake Lock, localhost/HTTPS only).
const canWake = "wakeLock" in navigator;
let wakeOn = false;
try { wakeOn = localStorage.getItem("awake") === "1"; } catch {}
let wakeLock = null;
const awakeBtn = document.getElementById("awake");

async function holdAwake() {
  if (!wakeOn || !canWake || wakeLock || document.hidden) return showAwake();
  try {
    wakeLock = await navigator.wakeLock.request("screen");
    wakeLock.addEventListener("release", () => { wakeLock = null; showAwake(); });
  } catch {}
  showAwake();
}
function showAwake() {
  awakeBtn.setAttribute("aria-pressed", String(wakeOn && !!wakeLock));
  awakeBtn.title = t(!canWake ? "awakeNo" : wakeOn ? "awakeOn" : "awakeOff");
}
awakeBtn.addEventListener("click", async () => {
  if (!canWake) { insecureHelp(t("awakeWhat")); return; }
  wakeOn = !wakeOn;
  try { localStorage.setItem("awake", wakeOn ? "1" : "0"); } catch {}
  if (wakeOn) await holdAwake();
  else if (wakeLock) { await wakeLock.release().catch(() => {}); wakeLock = null; }
  showAwake();
});
// The browser drops the lock whenever the page is hidden; take it again on return.
document.addEventListener("visibilitychange", holdAwake);
holdAwake();

// Full screen: no browser bars on the tablet.
const fsBtn = document.getElementById("fullscreen");
fsBtn.hidden = !document.fullscreenEnabled;
fsBtn.addEventListener("click", () => {
  if (document.fullscreenElement) document.exitFullscreen().catch(() => {});
  else document.documentElement.requestFullscreen().catch(() => {});
});
document.addEventListener("fullscreenchange", () => {
  fsBtn.setAttribute("aria-pressed", String(!!document.fullscreenElement));
});

function alertFor(s, st) {
  // You are looking at the page already.
  if (document.hasFocus() && !document.hidden) return;
  const name = s.project || s.sessionId.slice(0, 8);
  const text = st === "idle" ? s.lastMessage || srv(s.detail) : srv(s.detail) || s.task || s.lastMessage;
  // Same tag for the same moment, so several open tabs show one notification, not one each.
  const tl = s.timeline && s.timeline.length ? s.timeline[s.timeline.length - 1].at : s.updatedAt;
  try {
    const n = new Notification(t("alert." + st) + " · " + name, {
      body: hostLabel(s.host) + " · " + (AGENT[s.agent] || s.agent) + (text ? "\n" + text.slice(0, 240) : ""),
      tag: s.key + "|" + st + "|" + (st === "stale" ? s.updatedAt : tl),
      requireInteraction: st !== "idle",
    });
    n.onclick = () => {
      window.focus();
      n.close();
      if (!expanded.has(s.key)) toggle(s.key);
      const head = [...document.querySelectorAll("#hosts .head")].find(h => h.dataset.key === s.key);
      if (head) { head.scrollIntoView({ block: "center" }); head.focus({ preventScroll: true }); }
    };
  } catch {}
}

const notifyBtn = document.getElementById("notify");
function showNotify() {
  const granted = canNotify && Notification.permission === "granted";
  notifyBtn.setAttribute("aria-pressed", String(notifyOn && granted));
  notifyBtn.title = t(!canNotify ? "notifyNo" : Notification.permission === "denied" ? "notifyDenied"
    : notifyOn && granted ? "notifyOn" : "notifyOff");
}
notifyBtn.addEventListener("click", async () => {
  if (!canNotify) { insecureHelp(t("notifyWhat")); return; }
  if (notifyOn && Notification.permission === "granted") {
    notifyOn = false;
  } else {
    const p = Notification.permission === "default" ? await Notification.requestPermission() : Notification.permission;
    if (p !== "granted") { showNotify(); alert(t("notifyBlocked")); return; }
    notifyOn = true;
    try { new Notification(t("notifyHello"), { body: t("notifyHelloBody"), tag: "agent-status-on" }); } catch {}
  }
  try { localStorage.setItem("notify", notifyOn ? "1" : "0"); } catch {}
  showNotify();
});
showNotify();

// Hidden tabs get their timers throttled down to once a minute; a worker's timers are not,
// so while notifications or sound are on it keeps the polling (and the alerts) on time.
try {
  const beat = new Worker(URL.createObjectURL(new Blob(["setInterval(() => postMessage(0), " + REFRESH_MS + ")"], { type: "text/javascript" })));
  beat.onmessage = () => { if (document.hidden && (notifyOn || soundOn)) tick(); };
} catch {}

// A wait that drags on: past REMIND_MS the frame pulses, and while the sound is on the
// chime repeats every REMIND_MS for each session still waiting.
const REMIND_MS = 5 * MIN;
const reminded = new Map();   // session key -> when the wait was last chimed for
function remind() {
  if (!lastData) return;
  const now = new Date(lastData.now).getTime() + (Date.now() - lastFetch);
  const waiting = lastData.sessions.filter(s => s.state === "waiting");
  let long = false, due = false;
  for (const s of waiting) {
    const since_ = Date.parse(since(s));
    if (now - since_ < REMIND_MS) continue;
    long = true;
    const last = Math.max(reminded.get(s.key) || 0, since_);
    if (now - last >= REMIND_MS) { reminded.set(s.key, now); due = true; }
  }
  for (const k of reminded.keys()) if (!waiting.some(s => s.key === k)) reminded.delete(k);
  document.body.classList.toggle("alarm-long", long);
  if (due && soundOn) chime(["waiting"]);
}

setInterval(() => { paint(); remind(); }, 1000);
setGroup(groupBy);
setRange(range);
setShowEnded(showEnded);
tick();
</script>
</body>
</html>
