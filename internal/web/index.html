<!doctype html>
<html lang="pl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Agenci</title>
<style>
  /* Swimlanes: each session is a row with its recent states drawn on a strip; "now" is the right edge.
     Grouped by machine, by project, or as a queue ordered by what the session needs from you. */
  :root {
    --bg: #f2f3f1; --panel: #fbfbfa; --line: #d6d8d3; --grid: #e6e8e3; --text: #1a1c19; --muted: #686d66;
    --signal: #d0401f; --signal-soft: #fbe7e1; --ok: #3c8a5a; --warn: #b07405; --warn-soft: #f8efdc;
    --idle: #c4c8c1; --ended: #e0e2dd; --on-signal: #fff;
    --sans: "Archivo", "Segoe UI", system-ui, sans-serif;
    --mono: "Cascadia Mono", Consolas, ui-monospace, monospace;
    color-scheme: light;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #131513; --panel: #1a1c1a; --line: #2e322e; --grid: #242724; --text: #e8eae6; --muted: #959b93;
      --signal: #ff7552; --signal-soft: #33201b; --ok: #5dbb83; --warn: #e3a63c; --warn-soft: #2c2414;
      --idle: #454a44; --ended: #2a2d2a; --on-signal: #131513;
      color-scheme: dark;
    }
  }
  * { box-sizing: border-box; border-radius: 0; }
  body {
    margin: 0; padding: 16px; background: var(--bg); color: var(--text);
    font: 14px/1.45 var(--sans); font-variant-numeric: tabular-nums;
  }
  header { display: flex; justify-content: space-between; align-items: center; gap: 10px 16px; flex-wrap: wrap; margin-bottom: 16px; }
  h1 { font-size: 20px; margin: 0; font-weight: 700; }
  .bar { display: flex; align-items: center; gap: 10px 16px; flex-wrap: wrap; justify-content: flex-end; }
  .group { display: inline-flex; border: 1px solid var(--line); }
  .group button {
    font: inherit; font-size: 13px; padding: 4px 10px; min-height: 32px; border: 0; cursor: pointer;
    background: var(--panel); color: var(--muted);
  }
  .group button + button { border-left: 1px solid var(--line); }
  .group button[aria-pressed="true"] { background: var(--text); color: var(--bg); }
  .group button:focus-visible { outline: 2px solid var(--text); outline-offset: 1px; }
  .group button.locked { color: var(--warn); }
  button, .head { touch-action: manipulation; -webkit-tap-highlight-color: transparent; }

  /* Seen from the corner of your eye: a frame around the whole screen and a big line on top
     while a session waits for you (or needs a look). */
  body::before { content: ""; position: fixed; inset: 0; z-index: 10; pointer-events: none; border: 0 solid transparent; }
  body.alarm-waiting::before { border: 8px solid var(--signal); }
  body.alarm-check::before { border: 8px solid var(--warn); }
  .beacon {
    display: block; width: 100%; margin: 0 0 16px; padding: 12px 16px; border: 0; cursor: pointer; text-align: left;
    font: 700 22px/1.25 var(--sans); background: var(--signal); color: var(--on-signal);
  }
  .beacon.check { background: var(--warn); }
  .beacon[hidden] { display: none; }
  .beacon small { display: block; font: 400 14px/1.35 var(--sans); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .beacon:focus-visible { outline: 2px solid var(--text); outline-offset: 2px; }
  .summary { color: var(--muted); font-size: 13px; }
  .summary b { color: var(--text); }
  .summary b.signal { color: var(--signal); }
  .legend { display: flex; flex-wrap: wrap; gap: 4px 14px; font-size: 12px; color: var(--muted); margin: -4px 0 14px; }
  .legend i { display: inline-block; width: 14px; height: 8px; margin-right: 6px; }

  .hosts { display: grid; gap: 16px; }
  section { border: 1px solid var(--line); background: var(--panel); }
  .lanes, .head { display: grid; grid-template-columns: minmax(150px, 240px) minmax(0, 1fr) 104px; gap: 4px 16px; align-items: center; }
  section h2 {
    margin: 0; padding: 8px 14px; font-size: 13px; font-weight: 700;
    border-bottom: 1px solid var(--line); background: var(--bg);
  }
  section h2 .name { text-transform: uppercase; letter-spacing: .04em; }
  section h2 small { color: var(--muted); font-weight: 400; text-transform: none; letter-spacing: 0; margin-left: 8px; font-size: 12px; }
  section h2 .rename {
    font: 400 12px var(--sans); margin-left: 8px; padding: 0 4px; border: 0; background: none; cursor: pointer;
    color: var(--muted); text-transform: none; letter-spacing: 0;
  }
  section h2 .rename:focus-visible { outline: 2px solid var(--text); outline-offset: 1px; }
  section.q-waiting h2 .name { color: var(--signal); }
  section.q-check h2 .name { color: var(--warn); }
  .ticks { position: relative; height: 14px; font: 11px/14px var(--mono); color: var(--muted); font-weight: 400; }
  .ticks span { position: absolute; transform: translateX(-50%); white-space: nowrap; }
  .ticks span.first { transform: none; }
  .ticks span.last { transform: translateX(-100%); color: var(--text); }

  .row { border-bottom: 1px solid var(--grid); }
  .row:last-child { border-bottom: 0; }
  .head { padding: 10px 14px; cursor: pointer; }
  .head:focus-visible { outline: 2px solid var(--text); outline-offset: -2px; }
  .row.waiting { background: var(--signal-soft); }
  .row.error, .row.stale { background: var(--warn-soft); }
  .row.ended { opacity: .6; }
  .row.open { opacity: 1; }
  .who { min-width: 0; }
  .who b { display: block; font-weight: 600; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .who b::before { content: "▸"; display: inline-block; width: 14px; color: var(--muted); font-weight: 400; }
  .row.open .who b::before { content: "▾"; }
  .who span { display: block; padding-left: 14px; font-size: 12px; color: var(--muted); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .trk { min-width: 0; display: grid; gap: 4px; }
  .strip {
    position: relative; height: 14px; overflow: hidden;
    background: repeating-linear-gradient(to left, var(--grid) 0 1px, transparent 1px calc(100% / var(--n, 6)));
  }
  .strip i { position: absolute; top: 0; bottom: 0; }
  .s-working { background: var(--ok); }
  .s-waiting { background: var(--signal); }
  .s-error { background: var(--warn); }
  .s-idle { background: var(--idle); }
  .s-ended { background: var(--ended); }
  .s-stale { background: repeating-linear-gradient(135deg, var(--warn) 0 3px, transparent 3px 7px); }
  .strip .now { right: 0; width: 2px; background: var(--text); }
  .cap { min-width: 0; font-size: 13px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .cap .detail { font: 12px var(--mono); color: var(--muted); margin-left: 10px; }
  .cap .detail:first-child { margin-left: 0; }
  .row.waiting .cap { white-space: normal; overflow-wrap: anywhere; }
  .row.waiting .cap .detail { display: block; margin: 2px 0 0; font: 600 14px/1.35 var(--sans); color: var(--signal); }
  .row.open .cap { white-space: normal; overflow-wrap: anywhere; }
  .state { text-align: right; font-size: 13px; font-weight: 600; line-height: 1.25; white-space: nowrap; }
  .state small { display: block; font: 11px var(--mono); color: var(--muted); font-weight: 400; }
  .state.waiting { color: var(--signal); }
  .state.error, .state.stale { color: var(--warn); }
  .state.working { color: var(--ok); }
  .state.idle, .state.ended { color: var(--muted); font-weight: 400; }

  .info { margin: 0 14px; padding: 10px 0 14px 14px; border-top: 1px dashed var(--line); font-size: 13px; }
  .info dl { display: grid; grid-template-columns: max-content 1fr; gap: 3px 12px; margin: 0; }
  .info dt { color: var(--muted); }
  .info dd { margin: 0; overflow-wrap: anywhere; min-width: 0; }
  .info code { font: 12px/1.4 var(--mono); }
  .info h3 { font-size: 11px; font-weight: 700; text-transform: uppercase; letter-spacing: .04em; color: var(--muted); margin: 12px 0 4px; }
  .text { white-space: pre-wrap; overflow-wrap: anywhere; margin: 0; padding: 6px 8px; background: var(--bg); border-left: 2px solid var(--line); max-width: 90ch; }
  .tools { display: flex; flex-wrap: wrap; gap: 4px; }
  .tools span { border: 1px solid var(--line); padding: 1px 6px; background: var(--panel); }
  .tools b { font-weight: 600; margin-left: 4px; }
  .history { list-style: none; margin: 0; padding: 0; }
  .history li { display: grid; grid-template-columns: 64px 1fr; gap: 8px; padding: 2px 0; }
  .history time { color: var(--muted); font-family: var(--mono); font-size: 12px; }
  .history .msg { overflow-wrap: anywhere; min-width: 0; }
  .history .st { font-weight: 600; margin-right: 6px; }
  .history .st.waiting { color: var(--signal); }
  .history .st.error { color: var(--warn); }
  .history .st.working { color: var(--ok); }
  .history .st.idle, .history .st.ended { color: var(--muted); }
  .history .kind { color: var(--muted); }
  .actions { margin-top: 12px; display: flex; flex-wrap: wrap; gap: 8px; }
  .actions button {
    font: inherit; font-size: 13px; padding: 4px 10px; min-height: 32px; cursor: pointer;
    background: var(--panel); color: var(--text); border: 1px solid var(--line);
  }
  .actions button[data-remove] { color: var(--signal); }
  .empty, .offline { color: var(--muted); padding: 24px 0; }
  .offline { color: var(--warn); }

  /* Hover styles only where there is a real pointer: on a touch screen they stick after a tap. */
  @media (hover: hover) {
    .head:hover { background: color-mix(in srgb, var(--text) 4%, transparent); }
    section h2 .rename:hover { color: var(--text); text-decoration: underline; }
    .actions button:hover { border-color: var(--text); }
    .actions button[data-remove]:hover { border-color: var(--signal); }
  }
  /* Finger-sized targets on a touch screen. */
  @media (pointer: coarse) {
    .group button, .actions button { min-height: 44px; padding: 8px 14px; font-size: 15px; }
    section h2 .rename { padding: 10px 8px; margin: -10px 0 -10px 4px; font-size: 13px; }
    .head { padding: 14px; }
    .summary { font-size: 15px; }
  }

  @media (max-width: 700px) {
    .lanes { grid-template-columns: minmax(0, 1fr); }
    .lanes > .ticks { grid-row: 2; }
    .lanes > :last-child { display: none; }
    .head { grid-template-columns: minmax(0, 1fr) auto; }
    .head .trk { grid-column: 1 / -1; grid-row: 2; }
    .info { margin: 0 14px; padding-left: 0; }
  }
  @media (prefers-reduced-motion: reduce) { * { transition: none !important; } }
</style>
</head>
<body>
<header>
  <h1>Agenci</h1>
  <div class="bar">
    <div class="group" role="group" aria-label="Układ listy">
      <button type="button" data-group="host" title="Sesje pogrupowane według maszyny">maszyna</button>
      <button type="button" data-group="project" title="Sesje pogrupowane według projektu">projekt</button>
      <button type="button" data-group="queue" title="Najpierw sesje, które czekają na Ciebie">kolejka</button>
    </div>
    <div class="group" role="group" aria-label="Zakres osi czasu">
      <button type="button" data-range="15m">15 min</button>
      <button type="button" data-range="1h">1 h</button>
      <button type="button" data-range="4h">4 h</button>
      <button type="button" data-range="12h">12 h</button>
    </div>
    <div class="group" role="group" aria-label="Zakończone sesje">
      <button type="button" id="show-ended" title="Pokaż albo ukryj zakończone sesje">zakończone</button>
      <button type="button" id="clear-ended" title="Usuń wszystkie zakończone sesje z listy">usuń zakończone</button>
    </div>
    <div class="group" role="group" aria-label="Sygnały i ekran">
      <button type="button" id="notify" aria-pressed="false">powiadomienia</button>
      <button type="button" id="sound" aria-pressed="false">dźwięk</button>
      <button type="button" id="awake" aria-pressed="false">nie wygaszaj</button>
      <button type="button" id="fullscreen" aria-pressed="false">pełny ekran</button>
    </div>
    <div class="summary" id="summary"></div>
  </div>
</header>
<button type="button" id="beacon" class="beacon" hidden></button>
<div class="legend" aria-hidden="true">
  <span><i class="s-waiting"></i>czeka na Ciebie</span>
  <span><i class="s-working"></i>pracuje</span>
  <span><i class="s-error"></i>błąd</span>
  <span><i class="s-stale"></i>brak sygnału</span>
  <span><i class="s-idle"></i>gotowy</span>
</div>
<div id="offline" class="offline" hidden>Brak połączenia z serwerem</div>
<div id="late" class="offline" hidden></div>
<div id="hosts" class="hosts"></div>
<script>
const LABEL = { waiting: "czeka na Ciebie", working: "pracuje", error: "błąd", idle: "gotowy", ended: "zakończona", stale: "brak sygnału" };
const SHORT = { waiting: "czeka", working: "pracuje", error: "błąd", idle: "gotowy", ended: "zakończona", stale: "brak sygnału" };
const AGENT = { claude: "Claude Code", opencode: "OpenCode" };
const MIN = 60e3, HOUR = 60 * MIN;
// Window width and grid step of the strips.
const RANGES = {
  "15m": { ms: 15 * MIN, step: 5 * MIN },
  "1h": { ms: HOUR, step: 10 * MIN },
  "4h": { ms: 4 * HOUR, step: HOUR },
  "12h": { ms: 12 * HOUR, step: 2 * HOUR },
};
// Queue lanes, most urgent first.
const LANES = [
  { id: "waiting", title: "Czeka na Ciebie", has: s => s.state === "waiting" },
  { id: "check", title: "Do sprawdzenia", has: s => s.state === "error" || s.stale },
  { id: "working", title: "Pracuje", has: s => s.state === "working" && !s.stale },
  { id: "idle", title: "Gotowe", has: s => s.state === "idle" },
  { id: "ended", title: "Zakończone", has: s => s.state === "ended" },
];

function ago(iso, now) {
  const s = Math.max(0, Math.round((now - new Date(iso)) / 1000));
  if (s < 60) return s + " s";
  if (s < 3600) return Math.floor(s / 60) + " min";
  return Math.floor(s / 3600) + " h " + Math.floor((s % 3600) / 60) + " min";
}

function el(tag, cls, text) {
  const e = document.createElement(tag);
  if (cls) e.className = cls;
  if (text != null) e.textContent = text;
  return e;
}

const NO_PROJECT = "bez projektu";

// Names given to machines on this page, keyed by the name agents report.
let hostNames = {};
const hostLabel = h => hostNames[h] || h;

let groupBy = "host";
try { const g = localStorage.getItem("groupBy"); if (g === "project" || g === "queue") groupBy = g; } catch {}

function setGroup(g) {
  groupBy = g;
  try { localStorage.setItem("groupBy", g); } catch {}
  for (const b of document.querySelectorAll("[data-group]")) b.setAttribute("aria-pressed", String(b.dataset.group === g));
  paint();
}
for (const b of document.querySelectorAll("[data-group]")) b.addEventListener("click", () => setGroup(b.dataset.group));

let range = "1h";
try { const r = localStorage.getItem("range"); if (RANGES[r]) range = r; } catch {}

function setRange(r) {
  range = r;
  try { localStorage.setItem("range", r); } catch {}
  for (const b of document.querySelectorAll("[data-range]")) b.setAttribute("aria-pressed", String(b.dataset.range === r));
  paint();
}
for (const b of document.querySelectorAll("[data-range]")) b.addEventListener("click", () => setRange(b.dataset.range));

const MODE = { default: "domyślny", plan: "planowanie", acceptEdits: "akceptuje edycje", bypassPermissions: "bez pytań", dontAsk: "bez pytań", auto: "auto" };
const expanded = new Set();   // keys of sessions whose details are open
try { for (const k of JSON.parse(sessionStorage.getItem("expanded") || "[]")) expanded.add(k); } catch {}

function toggle(key) {
  if (expanded.has(key)) expanded.delete(key); else expanded.add(key);
  try { sessionStorage.setItem("expanded", JSON.stringify([...expanded])); } catch {}
  paint();
}

const clock = iso => new Date(iso).toLocaleTimeString("pl-PL", { hour: "2-digit", minute: "2-digit", second: "2-digit" });
const hm = t => new Date(t).toLocaleTimeString("pl-PL", { hour: "2-digit", minute: "2-digit" });
const sameDay = (a, b) => a.toDateString() === b.toDateString();
function when(iso, now) {
  const d = new Date(iso);
  const day = sameDay(d, now) ? "" : d.toLocaleDateString("pl-PL", { day: "numeric", month: "short" }) + " ";
  return day + clock(iso) + " (" + ago(iso, now) + " temu)";
}

function details(s, now) {
  const box = el("div", "info");
  const dl = el("dl");
  const item = (label, value, code) => {
    if (!value) return;
    const dd = el("dd");
    dd.append(code ? el("code", null, value) : value);
    dl.append(el("dt", null, label), dd);
  };
  item("Katalog", s.cwd, true);
  item("Maszyna", hostNames[s.host] ? hostNames[s.host] + " (" + s.host + ")" : s.host);
  item("Agent", AGENT[s.agent] || s.agent);
  item("Model", s.model);
  item("Tryb", s.mode && (MODE[s.mode] || s.mode));
  item("Sesja", s.sessionId, true);
  item("Rozpoczęta", s.startedAt && when(s.startedAt, now));
  item("Ostatni sygnał", when(s.updatedAt, now) + (s.lastEvent ? " · " + s.lastEvent : ""));
  const counts = [];
  if (s.prompts) counts.push(s.prompts + " " + plural(s.prompts, "polecenie", "polecenia", "poleceń"));
  if (s.toolCalls) counts.push(s.toolCalls + " " + plural(s.toolCalls, "narzędzie", "narzędzia", "narzędzi"));
  if (s.permissions) counts.push(s.permissions + " " + plural(s.permissions, "prośba o zgodę", "prośby o zgodę", "próśb o zgodę"));
  item("Aktywność", counts.join(" · "));
  box.append(dl);

  const block = (title, node) => { box.append(el("h3", null, title), node); };
  if (s.tools && Object.keys(s.tools).length) {
    const tools = el("div", "tools");
    for (const [name, n] of Object.entries(s.tools).sort((a, b) => b[1] - a[1] || a[0].localeCompare(b[0]))) {
      const t = el("span", null, name);
      t.append(el("b", null, String(n)));
      tools.append(t);
    }
    block("Użyte narzędzia", tools);
  }
  if (s.lastPrompt) block("Ostatnie polecenie", el("p", "text", s.lastPrompt));
  if (s.lastMessage) block(s.state === "error" ? "Ostatni błąd" : "Ostatnia odpowiedź", el("p", "text", s.lastMessage));
  if (s.history && s.history.length) {
    const ul = el("ul", "history");
    for (const h of [...s.history].reverse()) {
      const li = el("li");
      const t = el("time", null, clock(h.at));
      t.dateTime = h.at;
      const msg = el("div", "msg");
      if (h.state) msg.append(el("span", "st " + h.state, LABEL[h.state] || h.state));
      msg.append(h.detail ? h.detail : el("span", "kind", h.kind));
      li.title = h.kind;
      li.append(t, msg);
      ul.append(li);
    }
    block("Historia", ul);
  }
  const actions = el("div", "actions");
  const del = el("button", null, "Usuń z listy");
  del.type = "button";
  del.dataset.remove = s.key;
  del.title = "Sesja wróci, jeśli agent wyśle kolejne zdarzenie";
  const ren = el("button", null, "Zmień nazwę maszyny");
  ren.type = "button";
  ren.dataset.rename = s.host;
  ren.title = "Nazwa widoczna na tej stronie dla maszyny " + s.host;
  actions.append(ren, del);
  box.append(actions);
  return box;
}

function plural(n, one, few, many) {
  if (n === 1) return one;
  const d = n % 10, dd = n % 100;
  return d >= 2 && d <= 4 && (dd < 12 || dd > 14) ? few : many;
}

// State spans of a session as [from, to, state] in epoch ms; to = null means "until now".
// Older servers send no timeline, so fall back to the state changes in the short history.
function spans(s) {
  let tl = s.timeline && s.timeline.length ? s.timeline
    : (s.history || []).filter(h => h.state).map(h => ({ at: h.at, state: h.state }));
  const out = [];
  for (let i = 0; i < tl.length; i++) {
    const from = Date.parse(tl[i].at);
    const to = i + 1 < tl.length ? Date.parse(tl[i + 1].at) : null;
    const st = tl[i].state;
    if (st === "ended") continue;   // the strip simply stops where the session ended
    if (to === null && s.stale) {
      // Working, but silent: solid up to the last signal, hatched after it.
      const last = Date.parse(s.updatedAt);
      out.push([from, last, st], [last, null, "stale"]);
    } else {
      out.push([from, to, st]);
    }
  }
  return out;
}

// Positions a span on the strip for the current window; hides it when outside.
function place(i, now) {
  const win = RANGES[range].ms, start = now - win;
  const a = Math.max(+i.dataset.a, start);
  const b = i.dataset.b ? Math.min(+i.dataset.b, now) : now;
  if (b <= a) { i.hidden = true; return; }
  i.hidden = false;
  i.style.left = (100 * (a - start) / win) + "%";
  i.style.width = (100 * (b - a) / win) + "%";
}

function strip(s, now) {
  const box = el("div", "strip");
  for (const [a, b, st] of spans(s)) {
    const i = el("i", "s-" + st);
    i.dataset.a = a;
    i.dataset.b = b == null ? "" : b;
    i.title = (LABEL[st] || st) + " · " + hm(a) + "–" + (b == null ? "teraz" : hm(b));
    place(i, now);
    box.append(i);
  }
  box.append(el("i", "now"));
  return box;
}

function ticks() {
  const { ms, step } = RANGES[range];
  const box = el("div", "ticks");
  box.setAttribute("aria-hidden", "true");
  for (let t = ms; t >= 0; t -= step) {
    const label = t === 0 ? "teraz" : "−" + (t >= HOUR ? t / HOUR + " h" : t / MIN + " min");
    const sp = el("span", t === ms ? "first" : t === 0 ? "last" : null, label);
    sp.style.left = (100 * (ms - t) / ms) + "%";
    box.append(sp);
  }
  return box;
}

let showEnded = true;
try { showEnded = localStorage.getItem("showEnded") !== "0"; } catch {}

function setShowEnded(v) {
  showEnded = v;
  try { localStorage.setItem("showEnded", v ? "1" : "0"); } catch {}
  document.getElementById("show-ended").setAttribute("aria-pressed", String(v));
  paint();
}
document.getElementById("show-ended").addEventListener("click", () => setShowEnded(!showEnded));

async function removeSessions(query) {
  try {
    const r = await fetch("/api/sessions?" + query, { method: "DELETE" });
    if (!r.ok) throw new Error(r.status);
  } catch {
    alert("Nie udało się usunąć sesji");
  }
  tick();
}
async function renameHost(host) {
  const name = prompt("Nazwa maszyny " + host + " na tej stronie (puste = przywróć oryginalną):", hostLabel(host));
  if (name === null) return;
  try {
    const r = await fetch("/api/hosts", {
      method: "PUT",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ host, name }),
    });
    if (!r.ok) throw new Error(r.status);
  } catch {
    alert("Nie udało się zmienić nazwy maszyny");
  }
  tick();
}

document.getElementById("clear-ended").addEventListener("click", () => {
  const n = lastData ? lastData.sessions.filter(s => s.state === "ended").length : 0;
  if (n === 0) return;
  if (confirm("Usunąć z listy " + n + " " + plural(n, "zakończoną sesję", "zakończone sesje", "zakończonych sesji") + "?")) {
    removeSessions("ended=1");
  }
});

function row(s, now) {
  const isOpen = expanded.has(s.key);
  const cls = s.stale ? "stale" : s.state;
  const r = el("div", "row " + cls + (isOpen ? " open" : ""));
  const head = el("div", "head");
  head.tabIndex = 0;
  head.setAttribute("role", "button");
  head.setAttribute("aria-expanded", String(isOpen));
  head.dataset.key = s.key;
  if (!isOpen) head.title = "Kliknij, aby zobaczyć szczegóły";

  const agent = AGENT[s.agent] || s.agent;
  const name = s.project || s.sessionId.slice(0, 8);
  const host = hostLabel(s.host);
  const [title, sub] = groupBy === "project" ? [host, agent]
    : groupBy === "queue" ? [name, host + " · " + agent]
    : [name, agent];
  const who = el("div", "who");
  who.append(el("b", null, title), el("span", null, sub));

  const trk = el("div", "trk");
  trk.append(strip(s, now));
  if (s.task || s.detail) {
    const cap = el("div", "cap");
    if (s.task) cap.append(el("span", "task", s.task));
    if (s.detail) cap.append(el("span", "detail", s.detail));
    trk.append(cap);
  }

  const st = el("div", "state " + cls, SHORT[cls] || cls);
  st.title = LABEL[cls] || cls;
  const age = el("small", null, ago(s.updatedAt, now) + " temu");
  age.dataset.at = s.updatedAt;   // ticked in place by paint() between data changes
  st.append(age);

  head.append(who, trk, st);
  r.append(head);
  if (isOpen) r.append(details(s, new Date(now)));
  return r;
}

// host: set when the section is one machine, so its name can be changed from the header.
function section(name, count, list, now, cls, host) {
  const sec = el("section", cls);
  const h = el("h2", "lanes");
  const n = el("span", "name", name);
  n.append(el("small", null, count));
  if (host != null) {
    if (hostNames[host]) n.title = host;
    const ren = el("button", "rename", "zmień nazwę");
    ren.type = "button";
    ren.dataset.rename = host;
    ren.setAttribute("aria-label", "Zmień nazwę maszyny " + name);
    n.append(ren);
  }
  h.append(n, ticks(), el("span"));
  sec.append(h);
  // Fixed order (newest session first) so rows don't swap places whenever an agent reports.
  for (const s of [...list].sort((a, b) => b.startedAt.localeCompare(a.startedAt) || a.key.localeCompare(b.key))) {
    sec.append(row(s, now));
  }
  return sec;
}

function render(data) {
  if (!showEnded) data = { ...data, sessions: data.sessions.filter(s => s.state !== "ended") };
  hostNames = data.hostNames || {};
  const now = new Date(data.now).getTime();
  const hosts = document.getElementById("hosts");
  hosts.replaceChildren();
  hosts.style.setProperty("--n", RANGES[range].ms / RANGES[range].step);
  if (data.sessions.length === 0) {
    hosts.append(el("div", "empty", "Brak sesji"));
  }
  if (groupBy === "queue") {
    for (const lane of LANES) {
      const list = data.sessions.filter(lane.has);
      if (list.length) hosts.append(section(lane.title, String(list.length), list, now, "q-" + lane.id));
    }
  } else {
    const byProject = groupBy === "project";
    const groups = new Map();
    for (const s of data.sessions) {
      const k = byProject ? (s.project || NO_PROJECT) : s.host;
      if (!groups.has(k)) groups.set(k, []);
      groups.get(k).push(s);
    }
    // Alphabetical by shown name, so sections don't jump around on every refresh; "bez projektu" goes last.
    const label = k => byProject ? k : hostLabel(k);
    const order = ([a], [b]) => (a === NO_PROJECT) - (b === NO_PROJECT) || label(a).localeCompare(label(b)) || a.localeCompare(b);
    for (const [key, list] of [...groups].sort(order)) {
      const active = list.filter(s => s.state !== "ended").length + " aktywne";
      hosts.append(section(label(key), active, list, now, null, byProject ? null : key));
    }
  }
  const waiting = data.sessions.filter(s => s.state === "waiting").length;
  const working = data.sessions.filter(s => s.state === "working").length;
  const summary = document.getElementById("summary");
  summary.replaceChildren();
  const w = el("b", waiting ? "signal" : null, String(waiting));
  summary.append(w, " czeka · ", el("b", null, String(working)), " pracuje");
  document.title = waiting ? `(${waiting}) Agenci` : "Agenci";
  alarm(data.sessions);
}

// Frame around the screen and the big line on top: what needs you, readable at a glance.
function alarm(sessions) {
  const waiting = sessions.filter(s => s.state === "waiting");
  const check = sessions.filter(s => s.state === "error" || (s.stale && s.state !== "ended"));
  const list = waiting.length ? waiting : check;
  document.body.classList.toggle("alarm-waiting", waiting.length > 0);
  document.body.classList.toggle("alarm-check", !waiting.length && check.length > 0);
  const b = document.getElementById("beacon");
  b.hidden = list.length === 0;
  if (!list.length) return;
  const n = list.length;
  b.className = "beacon" + (waiting.length ? "" : " check");
  b.replaceChildren(
    n + " " + (waiting.length ? plural(n, "sesja czeka", "sesje czekają", "sesji czeka") + " na Ciebie"
      : plural(n, "sesja", "sesje", "sesji") + " do sprawdzenia"),
    el("small", null, list.map(s => (s.project || s.sessionId.slice(0, 8)) + " (" + hostLabel(s.host) + ")").join(" · ")),
  );
  b.title = "Pokaż kolejkę";
}
document.getElementById("beacon").addEventListener("click", () => {
  setGroup("queue");
  window.scrollTo({ top: 0 });
});

const REFRESH_MS = 3000;
let lastData = null;   // last payload, re-rendered every second so "ago" keeps counting
let lastFetch = 0;     // client time of the last successful fetch
let inFlight = false;
let timer = 0;

let lastSig = "";      // what the DOM currently shows; rebuilt only when this changes
let selectedAt = 0;    // when the text selection last changed
document.addEventListener("selectionchange", () => { selectedAt = Date.now(); });

function paint() {
  if (!lastData) return;
  const hostsEl = document.getElementById("hosts");
  // Shift the server's "now" by the time elapsed since the fetch, so ages stay live between polls.
  const elapsed = Date.now() - lastFetch;
  const now = new Date(new Date(lastData.now).getTime() + elapsed);
  const sig = JSON.stringify([lastData.sessions, lastData.hostNames, groupBy, range, showEnded, [...expanded]]);
  const sel = window.getSelection();
  // Re-rendering would drop a text selection, so it waits while someone copies text from the
  // open details (paths, prompts). A stray selection in a row (double-click) never blocks it,
  // and any selection only holds it for a while, so the list can't freeze.
  const anchor = sel && sel.anchorNode && (sel.anchorNode.nodeType === 1 ? sel.anchorNode : sel.anchorNode.parentElement);
  const selecting = sel && sel.toString().trim() !== "" && anchor && anchor.closest("#hosts .info") &&
    Date.now() - selectedAt < 15000;
  if (sig !== lastSig && !selecting) {
    const focusedKey = document.activeElement && document.activeElement.dataset ? document.activeElement.dataset.key : null;
    render({ ...lastData, now: now.toISOString() });
    lastSig = sig;
    if (focusedKey) {
      const again = [...hostsEl.querySelectorAll(".head")].find(h => h.dataset.key === focusedKey);
      if (again) again.focus({ preventScroll: true });
    }
  } else {
    // Nothing changed: only tick the ages and slide the strips, leaving the DOM (hover, focus, selection) alone.
    for (const e of hostsEl.querySelectorAll("[data-at]")) {
      e.textContent = ago(e.dataset.at, now) + " temu";
    }
    for (const i of hostsEl.querySelectorAll(".strip i[data-a]")) place(i, now.getTime());
  }
  // No ticking "refreshed N s ago" in the header (it shifted the layout every second);
  // speak up only when data is actually old.
  const s = Math.round(elapsed / 1000);
  const late = document.getElementById("late");
  late.hidden = s < 10 || !document.getElementById("offline").hidden;
  late.textContent = "Dane sprzed " + s + " s — serwer nie odpowiada";
}

async function tick() {
  clearTimeout(timer);
  if (inFlight) return;
  inFlight = true;
  try {
    const ctrl = new AbortController();
    const t = setTimeout(() => ctrl.abort(), 5000);
    const r = await fetch("/api/sessions", { cache: "no-store", signal: ctrl.signal });
    clearTimeout(t);
    if (!r.ok) throw new Error(r.status);
    lastData = await r.json();
    lastFetch = Date.now();
    watch(lastData.sessions);
    document.getElementById("offline").hidden = true;
  } catch {
    document.getElementById("offline").hidden = false;
  } finally {
    inFlight = false;
    paint();
    timer = setTimeout(tick, REFRESH_MS);
  }
}

// Background tabs throttle timers; catch up as soon as the page is visible again.
document.addEventListener("visibilitychange", () => { if (!document.hidden) tick(); });
window.addEventListener("focus", tick);
window.addEventListener("online", tick);
// One delegated listener: rows are rebuilt whenever the data changes.
const hostsRoot = document.getElementById("hosts");
hostsRoot.addEventListener("click", e => {
  const rm = e.target.closest("[data-remove]");
  if (rm) {
    expanded.delete(rm.dataset.remove);
    removeSessions("key=" + encodeURIComponent(rm.dataset.remove));
    return;
  }
  const ren = e.target.closest("[data-rename]");
  if (ren) {
    renameHost(ren.dataset.rename);
    return;
  }
  const head = e.target.closest(".head");
  if (!head) return;
  const sel = window.getSelection();
  if (sel && !sel.isCollapsed) return;   // finishing a text selection, not a click
  toggle(head.dataset.key);
});
hostsRoot.addEventListener("keydown", e => {
  const head = e.target.closest(".head");
  if (!head || (e.key !== "Enter" && e.key !== " ")) return;
  e.preventDefault();
  toggle(head.dataset.key);
});
// Browser notifications: a session starts waiting for you, fails, goes silent while working,
// or finishes its work. Only changes seen while the page is open count; the first load sets the baseline.
const ALERT = { waiting: "Czeka na Ciebie", error: "Błąd", stale: "Brak sygnału", idle: "Skończył pracę" };
const canNotify = "Notification" in window && window.isSecureContext;
let notifyOn = false;
try { notifyOn = localStorage.getItem("notify") === "1"; } catch {}
let seen = null;   // session key -> state as shown (stale counts as its own state)

const shownState = s => s.stale ? "stale" : s.state;

function watch(sessions) {
  const prev = seen;
  seen = new Map(sessions.map(s => [s.key, shownState(s)]));
  if (!prev) return;
  const changes = [];
  for (const s of sessions) {
    const now = shownState(s), was = prev.get(s.key);
    if (now === was || !ALERT[now]) continue;
    // "Done" only after actual work, not when an idle session shows up or a question gets dismissed.
    if (now === "idle" && was !== "working" && was !== "stale") continue;
    changes.push([s, now]);
  }
  if (!changes.length) return;
  if (notifyOn && canNotify && Notification.permission === "granted") {
    for (const [s, st] of changes) alertFor(s, st);
  }
  if (soundOn) chime(changes.map(c => c[1]));
}

// Some browser features only work on localhost or over HTTPS. The tablet opens the page by
// the server's LAN address over plain HTTP, so say how to allow it there.
function insecureHelp(what) {
  alert(what + " działa tylko na localhost albo przez HTTPS, a ta strona jest otwarta pod " + location.origin + ".\n\n" +
    "Aby to włączyć na tym urządzeniu: otwórz edge://flags/#unsafely-treat-insecure-origin-as-secure " +
    "(w Chrome: chrome://flags/#unsafely-treat-insecure-origin-as-secure), wpisz " + location.origin +
    ", ustaw Enabled i uruchom przeglądarkę ponownie.");
}

// Sound: plays even while you look at the page (the tablet always does), unlike notifications.
// Tones are generated, no audio files. Browsers start audio muted until the page is touched,
// so after a reload the button asks for one tap.
const AudioCtx = window.AudioContext || window.webkitAudioContext;
let soundOn = false;
try { soundOn = localStorage.getItem("sound") === "1"; } catch {}
let audio = null;

function audioCtx() {
  if (!audio && AudioCtx) {
    audio = new AudioCtx();
    audio.onstatechange = showSound;
  }
  return audio;
}

// [frequency Hz, start s, length s] per state, most urgent first.
const CHIMES = {
  waiting: [[660, 0, .25], [880, .18, .45]],
  error: [[392, 0, .3], [294, .25, .5]],
  stale: [[392, 0, .3], [294, .25, .5]],
  idle: [[523, 0, .6]],
};
function chime(states) {
  const ctx = audioCtx();
  if (!ctx || ctx.state !== "running") return;
  const st = Object.keys(CHIMES).find(k => states.includes(k));
  if (!st) return;
  const t0 = ctx.currentTime + .02;
  for (const [f, at, len] of CHIMES[st]) {
    const o = ctx.createOscillator(), g = ctx.createGain();
    o.type = "sine";
    o.frequency.value = f;
    g.gain.setValueAtTime(.0001, t0 + at);
    g.gain.exponentialRampToValueAtTime(.3, t0 + at + .02);
    g.gain.exponentialRampToValueAtTime(.0001, t0 + at + len);
    o.connect(g).connect(ctx.destination);
    o.start(t0 + at);
    o.stop(t0 + at + len + .05);
  }
}

const soundBtn = document.getElementById("sound");
function showSound() {
  const locked = soundOn && (!audio || audio.state !== "running");
  soundBtn.setAttribute("aria-pressed", String(soundOn));
  soundBtn.classList.toggle("locked", locked);
  soundBtn.textContent = locked ? "dźwięk: dotknij" : "dźwięk";
  soundBtn.title = locked ? "Przeglądarka wstrzymała dźwięk do pierwszego dotknięcia strony"
    : soundOn ? "Sygnał dźwiękowy, gdy sesja czeka na Ciebie, ma błąd, traci sygnał albo kończy pracę. Kliknij, aby wyłączyć"
    : "Włącz sygnał dźwiękowy, gdy sesja czeka na Ciebie, ma błąd, traci sygnał albo kończy pracę";
}
soundBtn.hidden = !AudioCtx;
soundBtn.addEventListener("click", async () => {
  const wasLocked = soundBtn.classList.contains("locked");
  if (soundOn && !wasLocked) {
    soundOn = false;
  } else {
    soundOn = true;
    try { await audioCtx().resume(); } catch {}
    chime(["waiting"]);   // so you hear what it sounds like and how loud
  }
  try { localStorage.setItem("sound", soundOn ? "1" : "0"); } catch {}
  showSound();
});
// Any touch on the page unlocks audio that the browser held back after a reload.
for (const ev of ["pointerdown", "keydown"]) {
  document.addEventListener(ev, () => {
    if (soundOn && audio && audio.state === "suspended") audio.resume().catch(() => {});
  }, true);
}
if (soundOn) audioCtx();
showSound();

// Keep the screen on while the page is visible (Screen Wake Lock, localhost/HTTPS only).
const canWake = "wakeLock" in navigator;
let wakeOn = false;
try { wakeOn = localStorage.getItem("awake") === "1"; } catch {}
let wakeLock = null;
const awakeBtn = document.getElementById("awake");

async function holdAwake() {
  if (!wakeOn || !canWake || wakeLock || document.hidden) return showAwake();
  try {
    wakeLock = await navigator.wakeLock.request("screen");
    wakeLock.addEventListener("release", () => { wakeLock = null; showAwake(); });
  } catch {}
  showAwake();
}
function showAwake() {
  awakeBtn.setAttribute("aria-pressed", String(wakeOn && !!wakeLock));
  awakeBtn.title = !canWake ? "Przeglądarka pozwala blokować wygaszanie ekranu tylko na localhost albo przez HTTPS"
    : wakeOn ? "Ekran nie wygasa, dopóki ta strona jest widoczna. Kliknij, aby wyłączyć"
    : "Nie wygaszaj ekranu, dopóki ta strona jest widoczna";
}
awakeBtn.addEventListener("click", async () => {
  if (!canWake) { insecureHelp("Blokada wygaszania ekranu"); return; }
  wakeOn = !wakeOn;
  try { localStorage.setItem("awake", wakeOn ? "1" : "0"); } catch {}
  if (wakeOn) await holdAwake();
  else if (wakeLock) { await wakeLock.release().catch(() => {}); wakeLock = null; }
  showAwake();
});
// The browser drops the lock whenever the page is hidden; take it again on return.
document.addEventListener("visibilitychange", holdAwake);
holdAwake();

// Full screen: no browser bars on the tablet.
const fsBtn = document.getElementById("fullscreen");
fsBtn.hidden = !document.fullscreenEnabled;
fsBtn.addEventListener("click", () => {
  if (document.fullscreenElement) document.exitFullscreen().catch(() => {});
  else document.documentElement.requestFullscreen().catch(() => {});
});
document.addEventListener("fullscreenchange", () => {
  fsBtn.setAttribute("aria-pressed", String(!!document.fullscreenElement));
});

function alertFor(s, st) {
  // You are looking at the page already.
  if (document.hasFocus() && !document.hidden) return;
  const name = s.project || s.sessionId.slice(0, 8);
  const text = st === "idle" ? s.lastMessage || s.detail : s.detail || s.task || s.lastMessage;
  // Same tag for the same moment, so several open tabs show one notification, not one each.
  const tl = s.timeline && s.timeline.length ? s.timeline[s.timeline.length - 1].at : s.updatedAt;
  try {
    const n = new Notification(ALERT[st] + " · " + name, {
      body: hostLabel(s.host) + " · " + (AGENT[s.agent] || s.agent) + (text ? "\n" + text.slice(0, 240) : ""),
      tag: s.key + "|" + st + "|" + (st === "stale" ? s.updatedAt : tl),
      requireInteraction: st !== "idle",
    });
    n.onclick = () => {
      window.focus();
      n.close();
      if (!expanded.has(s.key)) toggle(s.key);
      const head = [...document.querySelectorAll("#hosts .head")].find(h => h.dataset.key === s.key);
      if (head) { head.scrollIntoView({ block: "center" }); head.focus({ preventScroll: true }); }
    };
  } catch {}
}

const notifyBtn = document.getElementById("notify");
function showNotify() {
  const granted = canNotify && Notification.permission === "granted";
  notifyBtn.setAttribute("aria-pressed", String(notifyOn && granted));
  notifyBtn.title = !canNotify ? "Przeglądarka pozwala na powiadomienia tylko na localhost albo przez HTTPS"
    : Notification.permission === "denied" ? "Powiadomienia są zablokowane dla tej strony w ustawieniach przeglądarki"
    : notifyOn && granted ? "Powiadamiam, gdy sesja czeka na Ciebie, ma błąd, traci sygnał albo kończy pracę. Kliknij, aby wyłączyć"
    : "Włącz powiadomienia, gdy sesja czeka na Ciebie, ma błąd, traci sygnał albo kończy pracę";
}
notifyBtn.addEventListener("click", async () => {
  if (!canNotify) { insecureHelp("Powiadomienia"); return; }
  if (notifyOn && Notification.permission === "granted") {
    notifyOn = false;
  } else {
    const p = Notification.permission === "default" ? await Notification.requestPermission() : Notification.permission;
    if (p !== "granted") { showNotify(); alert("Powiadomienia są zablokowane dla tej strony. Odblokuj je w ustawieniach witryny (ikona obok adresu)."); return; }
    notifyOn = true;
    try { new Notification("Powiadomienia włączone", { body: "Dam znać, gdy agent będzie Cię potrzebował albo skończy pracę.", tag: "agent-status-on" }); } catch {}
  }
  try { localStorage.setItem("notify", notifyOn ? "1" : "0"); } catch {}
  showNotify();
});
showNotify();

// Hidden tabs get their timers throttled down to once a minute; a worker's timers are not,
// so while notifications or sound are on it keeps the polling (and the alerts) on time.
try {
  const beat = new Worker(URL.createObjectURL(new Blob(["setInterval(() => postMessage(0), " + REFRESH_MS + ")"], { type: "text/javascript" })));
  beat.onmessage = () => { if (document.hidden && (notifyOn || soundOn)) tick(); };
} catch {}

setInterval(paint, 1000);
setGroup(groupBy);
setRange(range);
setShowEnded(showEnded);
tick();
</script>
</body>
</html>
